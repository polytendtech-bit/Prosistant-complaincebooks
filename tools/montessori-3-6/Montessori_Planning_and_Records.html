function lessonDetail(id){const l=lesson(id);if(!l)return;dialog(l.title,`<div class="lesson-detail"><p><span class="pill">${esc(areaName(l.area))}</span> <span class="pill">${esc(l.stage)}</span></p><dl><dt>Direct aim</dt><dd>${esc(l.aim)}</dd><dt>Readiness / prior experience</dt><dd>${esc(l.readiness)}</dd><dt>Materials</dt><dd>${esc(l.materials)}</dd></dl><h3>Presentation outline</h3><p class="small muted">Invite, name the work and prepare the space. Show the movements slowly with minimal unnecessary speech. Pause for the child to choose whether to continue; demonstrate restoring the work when needed.</p><ol>${l.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><dl><dt>Point of interest</dt><dd>${esc(l.interest)}</dd><dt>Feedback / control of error</dt><dd>${esc(l.control)}</dd><dt>What to observe</dt><dd>${esc(l.observe)}</dd><dt>Possible next invitation</dt><dd>${esc(l.nextStep)}</dd><dt>Safety & access</dt><dd>${esc(l.safety)}</dd></dl><div class="notice">A concise planning aid for trained staff. Adapt to the actual child, language, material and program. A lesson is an invitation, not a required performance.</div><div class="actions">${btn('plan-from-lesson','Plan this lesson',`data-id="${id}"`,true)}${btn('observe-from-lesson','Record an observation',`data-id="${id}"`)}${l.custom?btn('lesson-edit','Edit custom lesson',`data-id="${id}"`):''}</div></div>`)}
function lessonForm(id){const l=state.customLessons.find(l=>l.id===id)||{title:'',area:'practical',stage:'Exploring',aim:'',materials:'',readiness:'',steps:[''],interest:'',control:'',observe:'',nextStep:'',safety:''};dialog(id?'Edit custom lesson':'Add a custom lesson',`<form id="lessonForm" data-id="${esc(id||'')}"><div class="form-grid">${field('Lesson title *','title',l.title,'text','required maxlength="200"')}<label>Area<select name="area">${options(AREAS.map(a=>[a.id,a.title]),l.area)}</select></label><label>Sequence<select name="stage">${options(STAGES.map(x=>[x,x]),l.stage)}</select></label>${textField('Direct aim *','aim',l.aim)}${textField('Materials *','materials',l.materials)}${textField('Readiness and prior experience *','readiness',l.readiness)}${textField('Presentation steps · one per line *','steps',l.steps.join('\n'))}${textField('Point of interest','interest',l.interest)}${textField('Feedback / control of error','control',l.control)}${textField('What to observe *','observe',l.observe)}${textField('Possible next invitation','nextStep',l.nextStep)}${textField('Safety and access considerations','safety',l.safety)}</div>${formFoot()}</form>`);for(const name of ['aim','materials','readiness','steps','observe'])document.querySelector(`#lessonForm [name=${name}]`).required=true;}
function plannerView(){const days=Array.from({length:7},(_,i)=>dayAdd(week,i));return head('Weekly plan','Plan a few thoughtful invitations. Leave room for repetition, spontaneous interests and uninterrupted self-chosen work.',btn('plan-new','Plan a lesson','',true)+btn('print','Print this week'))+`<div class="toolbar no-print">${btn('previous-week','← Previous')}<label>Week containing<input type="date" id="weekDate" value="${week}"></label>${btn('next-week','Next →')}${btn('this-week','This week')}<label>Child<select id="plannerChild"><option value="">All active children</option>${childOptions(selectedChild,true)}</select></label></div><div class="print-only"><h1>Weekly Montessori plan</h1><p>${dateLabel(week)} – ${dateLabel(dayAdd(week,6))}</p></div><section class="panel">${days.map(date=>{const ps=state.plans.filter(p=>p.date===date&&(!selectedChild?p.childIds.some(id=>!child(id)?.archived):p.childIds.includes(selectedChild))).sort((a,b)=>a.workCycle.localeCompare(b.workCycle));return `<div class="day"><div><h3>${dateLabel(date,{weekday:'long'})}</h3><span class="small muted">${dateLabel(date,{month:'short',day:'numeric'})}</span></div><div>${ps.length?ps.map(p=>`<article class="plan ${p.status}"><div class="flex"><h3>${esc(lesson(p.lessonId)?.title)}</h3><span class="pill">${esc(p.status)}</span></div><p><strong>${esc(p.childIds.map(id=>child(id)?.name).join(', '))}</strong> · ${esc(p.workCycle)}</p><p class="flow-text">${esc(p.focus||'Observe readiness before offering the lesson.')}</p>${p.materials?`<p class="small"><strong>Prepare:</strong> ${esc(p.materials)}</p>`:''}${p.notes?`<p class="small flow-text">${esc(p.notes)}</p>`:''}<div class="actions no-print">${btn('plan-edit','Edit',`data-id="${p.id}"`)}${btn('lesson-view','Presentation',`data-id="${p.lessonId}"`)}${btn('plan-observe','Record outcome',`data-id="${p.id}"`)}</div></article>`).join(''):'<p class="muted small">Open space for child-chosen work and observation.</p>'}</div></div>`}).join('')}</section><p class="tab-note muted">Marking a plan “presented” does not create a progress record. Use “Record outcome” for a dated observation of each child; a group plan needs individual evidence for each participant.</p>`}
function planForm(id,lessonId,childId){if(!activeChildren().length&&!id){toast('Add a child profile before planning a lesson.');closeDialog();go('children');return}const p=state.plans.find(p=>p.id===id)||{lessonId:lessonId||lessons()[0].id,childIds:childId?[childId]:selectedChild?[selectedChild]:[],date:weekStart(today())===week?today():week,workCycle:'Morning work cycle',focus:'',materials:lesson(lessonId||lessons()[0].id)?.materials||'',notes:'',status:'planned'};const kids=state.children.filter(c=>!c.archived||p.childIds.includes(c.id));dialog(id?'Edit lesson plan':'Plan a lesson',`<form id="planForm" data-id="${esc(id||'')}"><div class="form-grid"><label class="full">Lesson *<select name="lessonId" required>${options(lessons().map(l=>[l.id,areaName(l.area)+' · '+l.title]),p.lessonId)}</select></label><fieldset class="full"><legend>Child / small group *</legend><div class="checks">${kids.map(c=>`<label><input type="checkbox" name="childIds" value="${c.id}" ${p.childIds.includes(c.id)?'checked':''}>${esc(c.name)}${c.archived?' (archived)':''}</label>`).join('')}</div></fieldset>${field('Date *','date',p.date,'date','required')}<label>Work period<select name="workCycle">${options(['Morning work cycle','Afternoon work cycle','Outdoor / community','Flexible invitation'].map(x=>[x,x]),p.workCycle)}</select></label><label>Status<select name="status">${options(['planned','ready','presented','deferred'].map(x=>[x,x]),p.status)}</select></label>${textField('Why this invitation? Link it to an observation.','focus',p.focus)}${textField('Materials / preparation','materials',p.materials)}${textField('Adaptations, group arrangement and notes','notes',p.notes)}</div>${formFoot()}${id?btn('plan-delete','Delete plan',`data-id="${id}"`):''}</form>`)}
function observationsView(){const list=state.observations.filter(o=>(!selectedChild||o.childId===selectedChild)&&(!observationFilter||o.status===observationFilter)).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));return head('Observations','Record what happened, the support given and the next useful invitation. Keep interpretation separate from evidence.',btn('observation-new','Record observation','',true))+`<div class="toolbar no-print"><label>Child<select id="observationChild"><option value="">All children</option>${childOptions(selectedChild,true)}</select></label><label>Record status<select id="observationStatus"><option value="">All statuses</option>${options(Object.entries(STATUSES),observationFilter)}</select></label></div><section class="panel">${list.length?list.map(o=>recordMarkup(o,true)).join(''):empty('No observations match this view. A brief factual note is a useful place to start.')}</section>`}
function recordMarkup(o,edit=false){return `<article class="record"><div class="flex"><div><span class="small muted">${dateLabel(o.date)} · ${esc(child(o.childId)?.name)}</span><h3>${esc(lesson(o.lessonId)?.title)}</h3></div>${badge(o.status)}</div><p class="flow-text"><strong>Observed:</strong> ${esc(o.objective)}</p>${o.context?`<p class="flow-text"><strong>Context:</strong> ${esc(o.context)}</p>`:''}${o.independence?`<p class="flow-text"><strong>Support:</strong> ${esc(o.independence)}</p>`:''}${o.engagement?`<p class="flow-text"><strong>Engagement:</strong> ${esc(o.engagement)}</p>`:''}${o.nextStep?`<p class="flow-text"><strong>Next invitation:</strong> ${esc(o.nextStep)}</p>`:''}${o.teacher?`<p class="small muted">Recorded by ${esc(o.teacher)}</p>`:''}${edit?`<div class="actions no-print">${btn('observation-edit','Edit record',`data-id="${o.id}"`)}${btn('plan-from-observation','Plan next invitation',`data-id="${o.id}"`)}</div>`:''}</article>`}
function observationForm(id,lessonId,childId,planId){if(!state.children.length){toast('Add a child profile before recording an observation.');closeDialog();go('children');return}const plan=state.plans.find(p=>p.id===planId);const o=state.observations.find(o=>o.id===id)||{childId:childId||selectedChild||plan?.childIds[0]||activeChildren()[0]?.id||state.children[0].id,lessonId:lessonId||plan?.lessonId||lessons()[0].id,date:plan&&plan.date<=today()?plan.date:today(),status:'presented',context:plan?.focus||'',objective:'',engagement:'',independence:'',nextStep:'',teacher:''};dialog(id?'Edit observation':'Record an observation',`<form id="observationForm" data-id="${esc(id||'')}" data-plan="${esc(planId||'')}"><div class="form-grid"><label>Child *<select name="childId" required>${childOptions(o.childId,true)}</select></label>${field('Observation date *','date',o.date,'date',`required max="${today()}"`)}<label class="full">Lesson / work *<select name="lessonId">${options(lessons().map(l=>[l.id,areaName(l.area)+' · '+l.title]),o.lessonId)}</select></label><label>Observed status<select name="status">${options(Object.entries(STATUSES),o.status)}</select></label>${field('Recorded by','teacher',o.teacher||child(o.childId)?.teacher||'','text','maxlength="120"')}${textField('Context / invitation','context',o.context)}<label>What did you see or hear? *<textarea name="objective" required maxlength="5000" placeholder="Example: Poured water twice. On the second attempt, stopped before the cup filled and wiped one spill without a reminder.">${esc(o.objective)}</textarea></label>${textField('Support actually needed','independence',o.independence)}${textField('Engagement and child’s response','engagement',o.engagement)}${textField('Possible next invitation / follow-up','nextStep',o.nextStep)}</div><p class="small muted">Presented = a lesson was offered and demonstrated. Independent = performed without the recorded adult support in this observation. A declined invitation can be documented under interest or revisit; it is not a failure.</p>${plan?'<div class="notice">This records one child’s outcome. Update the group plan status separately, and record other participants individually.</div>':''}${formFoot('Save observation')}${id?btn('observation-delete','Delete record',`data-id="${id}"`):''}</form>`)}
function ensureSelected(){if(!child(selectedChild))selectedChild=activeChildren()[0]?.id||state.children[0]?.id||'';return child(selectedChild)}
function progressView(){const c=ensureSelected();return head('Progress record','The latest dated observation for each lesson, with the full history kept underneath. This is not a score or a checklist to finish.',btn('print','Print record'))+`<div class="toolbar no-print"><label>Child<select id="progressChild">${childOptions(selectedChild,true)}</select></label><label>Area<select id="progressArea"><option value="">All areas</option>${options(AREAS.map(a=>[a.id,a.title]),areaFilter)}</select></label></div>`+(!c?empty('Add a child to begin an individual progress record.'): `<div class="print-only"><h1>Montessori progress record</h1><p>${esc(c.name)} · As of ${dateLabel(today())}</p></div><section class="panel"><h2>${esc(c.name)}</h2><p class="muted">${esc(age(c.dob))} · ${esc(c.language||'Home language not recorded')}</p><div class="grid">${AREAS.map(a=>{const ls=lessons().filter(l=>l.area===a.id),n=ls.filter(l=>latest(c.id,l.id)).length;return `<div><h3>${esc(a.title)}</h3><div class="area-bar"><span style="width:${n/ls.length*100}%"></span></div><span class="small muted">${n} of ${ls.length} library lessons have an observation</span></div>`}).join('')}</div><p class="small muted">These bars show record coverage only, not attainment, expected pace or a comparison with other children.</p></section><section class="panel table-scroll"><table class="progress-grid"><thead><tr><th>Lesson</th><th>Latest status</th><th>Date</th><th>Support / next invitation</th><th class="no-print">Action</th></tr></thead><tbody>${lessons().filter(l=>!areaFilter||l.area===areaFilter).map(l=>{const o=latest(c.id,l.id);return `<tr><td><strong>${esc(l.title)}</strong><br><span class="small muted">${esc(areaName(l.area))}</span></td><td>${badge(o?.status)}</td><td>${o?dateLabel(o.date):'—'}</td><td class="flow-text">${esc(o?.nextStep||o?.independence||'—')}</td><td class="no-print">${btn('observe-specific','Add note',`data-child="${c.id}" data-id="${l.id}"`)}</td></tr>`}).join('')}</tbody></table></section>`)}
function reportsView(){const c=ensureSelected();const valid=validDate(reportFrom)&&validDate(reportTo)&&reportFrom<=reportTo&&reportTo<=today();const obs=c&&valid?state.observations.filter(o=>o.childId===c.id&&o.date>=reportFrom&&o.date<=reportTo).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt.localeCompare(b.createdAt)):[];return head('Individual learning report','Review this staff record before sharing. Choose a date range, print to paper or PDF, or export the observations as CSV.',btn('print','Print / save PDF')+btn('csv','Export observations CSV'))+`<div class="toolbar no-print"><label>Child<select id="reportChild">${childOptions(selectedChild,true)}</select></label><label>From<input id="reportFrom" type="date" value="${esc(reportFrom)}" max="${today()}"></label><label>Through<input id="reportTo" type="date" value="${esc(reportTo)}" max="${today()}"></label></div>`+(!c?empty('Add a child and observations to create a report.'):!valid?'<div class="notice error">Choose a valid date range ending on or before today.</div>':`<section class="panel report-sheet"><div class="report-title"><div class="kicker">Growing Together · Montessori 3–6</div><h1>${esc(c.name)}</h1><p>${dateLabel(reportFrom)} – ${dateLabel(reportTo)} · ${obs.length} recorded observations</p></div><h3>Current profile</h3><p class="small muted">Profile fields reflect the current profile, not a historical snapshot of the selected period.</p><p class="flow-text"><strong>Strengths:</strong> ${esc(c.strengths||'Not recorded')}</p><p class="flow-text"><strong>Interests:</strong> ${esc(c.interests||'Not recorded')}</p><p class="flow-text"><strong>Language / communication:</strong> ${esc(c.language||'Not recorded')}</p><div class="notice no-print">Staff working report: check names, quotes and sensitive context before sharing. Teaching support notes from the profile are omitted; observation text is included as entered.</div>${AREAS.map(a=>{const rows=obs.filter(o=>lesson(o.lessonId)?.area===a.id);return `<section class="report-area"><h2>${esc(a.title)}</h2>${rows.length?rows.map(o=>recordMarkup(o)).join(''):'<p class="small muted">No observations recorded in this period. This does not establish that the child did no work in this area.</p>'}</section>`}).join('')}<p class="small muted">Statuses describe individual dated observations. This record does not provide a standardized assessment, diagnosis, guaranteed readiness for school or a permanent mastery judgment.</p></section>`)}
function guideView(){return head('A thoughtful working system','Use the records to improve teaching decisions. Keep the child’s choice, dignity and long work cycle at the center.')+`<section class="panel"><h2>Keep a copy you can restore</h2><p>Records stay in this browser profile on this device. They are not uploaded, shared across devices, encrypted by this tool or automatically backed up. Clearing browser data, using private mode, moving the HTML file or changing browsers can make records unavailable.</p><div class="actions">${btn('backup','Export full backup','',true)}${btn('import','Restore a backup')}${btn('csv-all','Export all observations CSV')}${btn('demo','Add fictional sample records')}</div><p class="small muted" style="margin-top:12px">A JSON backup restores profiles, custom lessons, plans and observations. CSV is for review in a spreadsheet and cannot restore the system. Protect both files as child records. Restore replaces the current dataset after confirmation; it first downloads a copy of current records.</p></section><section class="panel"><h2>A flexible three-year journey</h2><div class="grid"><div><h3>Exploring</h3><p>Belonging, routines, movement, practical life, sensory exploration, oral language and concrete quantities. Offer simple purposeful work and observe what draws the child back.</p></div><div><h3>Developing</h3><p>Longer sequences, finer comparisons, sound-symbol relationships, composing words, connecting numbers and quantities, and sustained inquiry. Continue familiar work alongside new invitations.</p></div><div><h3>Extending</h3><p>Reading for meaning, purposeful writing, decimal operations with materials, cultural investigations, collaboration and creative projects. Offer greater complexity when prior understanding is observable.</p></div></div><div class="notice">These are teaching sequence descriptions, not age groups. Children may be exploring in one area and extending in another. All three stages can coexist in a mixed-age room.</div></section><section class="panel"><h2>The planning rhythm</h2><ol><li><strong>Prepare the environment.</strong> Check complete materials, accessible shelving, clear pathways and safe choices. Include familiar work in every area.</li><li><strong>Observe before planning.</strong> Note the child’s interest, prior experience, language and movement. Separate a fact from an interpretation.</li><li><strong>Choose a few invitations.</strong> Link a plan to evidence. Individual and small-group presentations can coexist with a long, protected work period; avoid turning the morning into a rotation schedule.</li><li><strong>Present with care.</strong> Invite rather than insist. Show a clear sequence and its restoration. Use the material’s feedback without pretending every activity is self-correcting.</li><li><strong>Step back.</strong> Allow repetition and concentration. Intervene for safety, misuse or meaningful support, using the least help needed.</li><li><strong>Record and revisit.</strong> Write a brief dated observation. Plan a useful next opportunity; repeated independent performances across time and contexts are stronger evidence than one event.</li></ol></section><section class="panel"><h2>What the record labels mean</h2>${Object.entries(STATUSES).map(([k,v])=>`<p>${badge(k)} ${esc({interest:'The child noticed or chose related work. This does not establish performance.',presented:'A lesson was offered and demonstrated. The child may still need repeated presentations.',practicing:'The child is working with the material; record the actual help and errors.',independent:'The child worked without the noted adult support in this particular observation. Keep observing over time.',revisit:'Another invitation, a different material or additional support may be helpful. Record why without labeling the child.'}[k])}</p>`).join('')}<p>“Not recorded” means there is no linked observation. It does not mean incapable, absent, behind or not introduced elsewhere. The progress view chooses the newest observation date, then the most recently created record for a same-day tie. Editing an older record does not silently make it the newest event.</p></section><section class="panel"><h2>Write evidence, not judgments</h2><p><strong>Useful:</strong> “Matched five color pairs. Compared the final two twice, then changed one pair without a prompt.”</p><p><strong>Less useful:</strong> “Very smart, mastered colors.”</p><p><strong>Useful:</strong> “Watched the zipper demonstration, declined a turn, and chose table washing. Offer the frame again near coat time.”</p><p><strong>Less useful:</strong> “Refuses practical life.”</p></section><section class="panel"><h2>Scope, inclusion and professional judgment</h2><p>The 72 starter lessons are a broad planning library, not a complete Montessori training album, an AMI/AMS-endorsed curriculum or a requirement for every child. Presentation details and sequences vary by training tradition, language and materials. A trained guide should review and adapt them.</p><p>Include home languages, adaptive tools, accessible movement and communication. Do not force sensory contact, speech, eye contact, public performance or fixed age targets. Document supports neutrally and coordinate individual plans through your program’s approved process.</p><p>This tool does not replace attendance, medication, incident, safeguarding, licensing or formal special-education records. Do not enter those records here. Use approved access-controlled systems when records must be shared among staff.</p><p>Professional reference routes for your review: <a href="https://amshq.org/" target="_blank" rel="noopener noreferrer">American Montessori Society</a>, <a href="https://montessori-ami.org/" target="_blank" rel="noopener noreferrer">Association Montessori Internationale</a>, and <a href="https://www.naeyc.org/resources/position-statements/dap" target="_blank" rel="noopener noreferrer">NAEYC developmentally appropriate practice</a>. These links are starting points; this edition has not been independently reviewed or endorsed by those organizations.</p></section><section class="panel"><h2>Daily and weekly checklist</h2><ul><li><strong>Before children arrive:</strong> prepare complete work, review access and safety, and choose a few possible invitations.</li><li><strong>During the work cycle:</strong> observe, give brief presentations, protect concentration and note the support actually used.</li><li><strong>At the end of the day:</strong> finish short factual records, restore materials and adjust tomorrow’s invitations.</li><li><strong>Each week:</strong> review children and areas with little recorded evidence without turning coverage into a quota; revisit follow-ups and export a backup.</li><li><strong>Before a conference:</strong> choose a date range, check the report, add family perspectives through your approved process and agree on a few practical next steps.</li></ul></section>`}
function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function backup(prefix='Montessori_Backup'){download(`${prefix}_${today()}.json`,JSON.stringify({...state,exportedAt:new Date().toISOString(),curriculumEdition:'starter-72-v1'},null,2),'application/json');toast('Backup download requested. Check your Downloads folder.');}
function csvCell(s){let t=String(s??'');if(/^[\s]*[=+\-@]/.test(t)||/^[\t\r\n]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'}
function exportCsv(all=false){if(!all&&(!selectedChild||!validDate(reportFrom)||!validDate(reportTo)||reportFrom>reportTo||reportTo>today())){toast('Choose a child and a valid report date range first.');return}const rows=state.observations.filter(o=>all||(o.childId===selectedChild&&o.date>=reportFrom&&o.date<=reportTo));const fields=['Child','Date','Area','Lesson','Observed status','Context','Objective observation','Support','Engagement','Next invitation','Recorded by'];const data=rows.map(o=>[child(o.childId)?.name,o.date,areaName(lesson(o.lessonId)?.area),lesson(o.lessonId)?.title,STATUSES[o.status],o.context,o.objective,o.independence,o.engagement,o.nextStep,o.teacher]);download(`Montessori_Observations_${today()}.csv`,'\uFEFF'+[fields,...data].map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV download requested.');}
function loadDemo(){if(!confirm('Add clearly fictional sample profiles, plans and observations? Your existing records will be kept. You can archive the sample children later.'))return;const id1=uid(),id2=uid();if(commit(s=>{s.children.push({id:id1,name:'SAMPLE · Alex',dob:dayAdd(today(),-1460),start:dayAdd(today(),-60),language:'English and a home language',strengths:'Enjoys caring for the classroom.',interests:'Water work, stories and plants.',supports:'Allow time to observe before offering a turn.',teacher:'Sample guide',archived:false},{id:id2,name:'SAMPLE · Casey',dob:dayAdd(today(),-1825),start:dayAdd(today(),-100),language:'English',strengths:'Returns to complex work with persistence.',interests:'Number materials and drawing.',supports:'Use a quiet presentation space.',teacher:'Sample guide',archived:false});s.observations.push({id:uid(),childId:id1,lessonId:'L004',date:dayAdd(today(),-1),status:'practicing',context:'Chose water pouring during the work cycle.',objective:'Poured twice. Stopped before the receiving pitcher filled on the second attempt and wiped one spill after a reminder.',engagement:'Returned to the work once.',independence:'One verbal reminder to find the sponge.',nextStep:'Offer the same setup and observe cleanup without a prompt.',teacher:'Sample guide',createdAt:new Date().toISOString()},{id:uid(),childId:id2,lessonId:'L044',date:today(),status:'presented',context:'Individual invitation after composing decimal quantities.',objective:'Watched the quantity demonstration and compared a ten bar with unit beads.',engagement:'Asked to repeat the comparison.',independence:'Adult guided counting.',nextStep:'Repeat quantity comparisons before introducing more symbols.',teacher:'Sample guide',createdAt:new Date().toISOString()});s.plans.push({id:uid(),childIds:[id1],lessonId:'L004',date:today(),workCycle:'Morning work cycle',focus:'Revisit pouring after yesterday’s observation.',materials:'Two small pitchers; tray; a little water; sponge.',notes:'Keep the work available for repetition.',status:'ready'});})){render();toast('Fictional sample records added.');}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){go(b.dataset.view);return}const a=b.dataset.action,id=b.dataset.id;if(!a)return;switch(a){case'close':closeDialog();break;case'child-new':childForm();break;case'child-edit':childForm(id);break;case'child-archive':{const c=child(id);if(confirm(`${c.archived?'Restore':'Archive'} ${c.name}? Plans and observations will be kept.`)&&commit(s=>s.children.find(c=>c.id===id).archived=!c.archived)){render();toast(c.archived?'Child restored.':'Child archived; records retained.');}break}case'child-progress':selectedChild=id;go('progress');break;case'lesson-view':lessonDetail(id);break;case'lesson-new':lessonForm();break;case'lesson-edit':lessonForm(id);break;case'plan-new':planForm();break;case'plan-edit':planForm(id);break;case'plan-from-lesson':planForm(undefined,id);break;case'observe-from-lesson':observationForm(undefined,id);break;case'observe-specific':observationForm(undefined,id,b.dataset.child);break;case'observation-new':observationForm();break;case'observation-edit':observationForm(id);break;case'plan-observe':{const p=state.plans.find(p=>p.id===id);observationForm(undefined,p.lessonId,p.childIds[0],id);break}case'plan-from-observation':{const o=state.observations.find(o=>o.id===id);planForm(undefined,o.lessonId,o.childId);break}case'plan-delete':case'observation-delete':{const key=a==='plan-delete'?'plans':'observations';if(confirm('Delete this record permanently? Export a backup first if you may need it.')&&commit(s=>s[key]=s[key].filter(r=>r.id!==id))){closeDialog();render();toast('Record deleted.');}break}case'previous-week':week=dayAdd(week,-7);render();break;case'next-week':week=dayAdd(week,7);render();break;case'this-week':week=weekStart(today());render();break;case'go-planner':go('planner');break;case'go-guide':go('guide');break;case'print':window.print();break;case'backup':backup();break;case'import':document.querySelector('#importFile').click();break;case'csv':exportCsv();break;case'csv-all':exportCsv(true);break;case'demo':loadDemo();break;}});
document.addEventListener('change',e=>{const t=e.target;switch(t.id){case'archivedToggle':showArchived=t.checked;render();break;case'areaFilter':case'progressArea':areaFilter=t.value;render();break;case'stageFilter':stageFilter=t.value;render();break;case'weekDate':if(validDate(t.value))week=weekStart(t.value);render();break;case'plannerChild':case'observationChild':case'progressChild':case'reportChild':selectedChild=t.value;render();break;case'observationStatus':observationFilter=t.value;render();break;case'reportFrom':reportFrom=t.value;render();break;case'reportTo':reportTo=t.value;render();break;}if(t.name==='lessonId'&&t.form?.id==='planForm'){t.form.elements.materials.value=lesson(t.value)?.materials||'';}});
document.addEventListener('input',e=>{if(e.target.id==='lessonSearch'){const pos=e.target.selectionStart;search=e.target.value;render();const input=document.querySelector('#lessonSearch');input.focus();input.setSelectionRange(pos,pos);}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f),get=k=>String(fd.get(k)||'').trim(),id=f.dataset.id||uid();let saved=false;
 if(f.id==='childForm'){const old=child(id);const c={id,name:get('name'),dob:get('dob'),start:get('start'),teacher:get('teacher'),language:get('language'),strengths:get('strengths'),interests:get('interests'),supports:get('supports'),archived:old?.archived||false};saved=commit(s=>{if(old)s.children[s.children.findIndex(c=>c.id===id)]=c;else s.children.push(c)});}
 if(f.id==='lessonForm'){const l={id,title:get('title'),area:get('area'),stage:get('stage'),aim:get('aim'),materials:get('materials'),readiness:get('readiness'),steps:get('steps').split('\n').map(x=>x.trim()).filter(Boolean),interest:get('interest'),control:get('control'),observe:get('observe'),nextStep:get('nextStep'),safety:get('safety'),custom:true};saved=commit(s=>{const i=s.customLessons.findIndex(l=>l.id===id);if(i>=0)s.customLessons[i]=l;else s.customLessons.push(l)});}
 if(f.id==='planForm'){const childIds=fd.getAll('childIds');if(!childIds.length){toast('Choose at least one child for the invitation.');return}const p={id,lessonId:get('lessonId'),childIds,date:get('date'),workCycle:get('workCycle'),focus:get('focus'),materials:get('materials'),notes:get('notes'),status:get('status')};saved=commit(s=>{const i=s.plans.findIndex(p=>p.id===id);if(i>=0)s.plans[i]=p;else s.plans.push(p)});if(saved)week=weekStart(p.date);}
 if(f.id==='observationForm'){const old=state.observations.find(o=>o.id===id);const o={id,childId:get('childId'),lessonId:get('lessonId'),date:get('date'),status:get('status'),context:get('context'),objective:get('objective'),engagement:get('engagement'),independence:get('independence'),nextStep:get('nextStep'),teacher:get('teacher'),createdAt:old?.createdAt||new Date().toISOString()};saved=commit(s=>{const i=s.observations.findIndex(o=>o.id===id);if(i>=0)s.observations[i]=o;else s.observations.push(o)});}
 if(saved){closeDialog();if(f.id==='planForm')activeView='planner';if(f.id==='observationForm')activeView='observations';render();toast(memoryOnly?'Kept in this session. Export a backup before closing.':'Saved on this device.');}});
document.querySelector('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{assert(file.size<=10*1024*1024,'Backup exceeds the 10 MB import limit.');const imported=validate(JSON.parse(await file.text()));const count=imported.children.length;if(!confirm(`Restore ${count} child profile(s), ${imported.plans.length} plan(s) and ${imported.observations.length} observation(s)? This REPLACES the current records. A backup download of current records will be requested first. Check that the download completes before closing the app.`))return;backup('Montessori_Before_Restore');if(commit(s=>Object.assign(s,imported))){selectedChild='';closeDialog();render();toast('Backup restored. Current records have been replaced.');}}catch(err){alert('Backup was not imported. Current records are unchanged. '+err.message)}});
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY&&!memoryOnly){try{state=e.newValue?validate(JSON.parse(e.newValue)):blank();closeDialog();render();toast('Records changed in another tab. This view has been refreshed.');}catch(err){storageProblem='Another tab changed records to an unreadable format. Export this tab’s records and reload only after checking your backup.';memoryOnly=true;render();}}});
render();
</script></body></html>
