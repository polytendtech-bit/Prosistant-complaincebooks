 12px}.muted{color:var(--muted)}.small{font-size:12px}.pill{display:inline-block;border-radius:20px;padding:4px 10px;font-size:12px;background:var(--pale)}.pill.independent{background:#d2e8d5}.pill.revisit{background:#f8e2d6}.pill.practicing{background:#e4ecf7}.pill.presented{background:#eee6f5}.pill.interest{background:var(--gold)}.page-head,.toolbar,.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.page-head{margin-bottom:23px}.page-head p{max-width:760px}.toolbar{justify-content:flex-start;margin:0 0 20px}.toolbar input{min-width:0;flex:1}.toolbar label{flex:1;min-width:150px}.day>div{min-width:0}.card,.plan,.record{overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.stat,.card,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:22px}.stat strong{display:block;font:500 34px/1.3 Georgia,serif}.stat span{font-size:12px;color:var(--muted)}.card{display:flex;flex-direction:column;gap:9px}.card p{font-size:14px}.card .actions{margin-top:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}.panel{margin-bottom:20px}.empty{border:1px dashed #b5c5b6;border-radius:12px;padding:34px;text-align:center;background:#fbfcf9}.notice{background:var(--gold);border:1px solid #e2d4ad;border-radius:9px;padding:12px 16px;margin:16px 0;font-size:13px}.notice.error{background:#fde7e2;border-color:#e2b1a7;color:#81392c}label{display:grid;gap:5px;font-size:13px;font-weight:600;min-width:0}input,select,textarea{width:100%;border:1px solid #bfcbbf;border-radius:7px;padding:9px 10px;background:white;color:var(--ink);min-width:0}input[type=checkbox]{width:auto}textarea{resize:vertical;min-height:85px}fieldset{border:1px solid var(--line);border-radius:8px;min-width:0;padding:12px}legend{font-size:13px;font-weight:600}.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px}.checks label{display:flex;gap:8px;align-items:center;font-weight:400}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}.flow-text{white-space:pre-wrap;overflow-wrap:anywhere}.table-scroll{overflow:auto;max-width:100%}table{border-collapse:collapse;width:100%;text-align:left;font-size:13px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}td button{padding:5px 9px}.day{display:grid;grid-template-columns:125px 1fr;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}.plan{padding:14px 16px;border:1px solid var(--line);border-left:4px solid #7e9e7e;border-radius:9px;background:white;margin-bottom:10px}.plan.deferred{border-left-color:#c49b5a}.plan.presented{border-left-color:#727da7}.plan p{font-size:13px;margin:6px 0}.record{border-bottom:1px solid var(--line);padding:18px 0}.record:last-child{border-bottom:0}.record p{margin:8px 0;font-size:14px}.progress-grid th:first-child,.progress-grid td:first-child{min-width:220px}.area-bar{height:7px;background:var(--pale);border-radius:5px;overflow:hidden;margin:8px 0}.area-bar span{display:block;height:100%;background:#698c6d}.lesson-heading{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.kicker{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}details{border-bottom:1px solid var(--line);padding:14px 0}summary{font-weight:600;cursor:pointer}dialog{border:1px solid var(--line);border-radius:16px;max-width:780px;width:calc(100% - 24px);max-height:90vh;padding:26px;color:var(--ink)}dialog::backdrop{background:#1c302777;backdrop-filter:blur(2px)}.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.dialog-head h2{margin-top:5px}.dialog-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:23px;position:sticky;bottom:-26px;background:white;padding:14px 0}.lesson-detail dl{display:grid;grid-template-columns:145px 1fr;gap:10px 18px}.lesson-detail dt{font-size:12px;font-weight:600;color:var(--muted)}.lesson-detail dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.lesson-detail ol{padding-left:24px}.lesson-detail li{padding:5px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:5;padding:12px 20px;background:var(--ink);color:white;border-radius:9px;max-width:90vw;box-shadow:0 8px 30px #0002}.report-title{border-bottom:2px solid var(--green);padding-bottom:16px;margin-bottom:20px}.report-area{margin:24px 0}.print-only{display:none}ul{padding-left:21px}.readiness{font-size:12px;color:var(--muted)}.inline-label{display:flex;align-items:center;gap:7px;font-weight:400}.inline-label input{width:auto}.tab-note{font-size:13px;max-width:850px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

</style></head><body>
<div class="shell"><aside><div class="brand">Growing<br>Together<small>Montessori · Ages 3–6</small></div><nav aria-label="Main navigation" id="nav"></nav><div class="aside-foot">Observe thoughtfully.<br>Offer a clear lesson.<br>Make room for repetition.<br><br>Staff working records · stored on this device.</div></aside><main><header><p>A prepared environment for every child</p><span class="pill" id="saveBadge">Local device storage</span></header><div id="storageWarning"></div><div id="app"></div></main></div>
<dialog id="dialog" aria-labelledby="dialogTitle"></dialog><div id="toast" role="status" aria-live="polite" hidden></div><input id="importFile" type="file" accept="application/json,.json" hidden>
<script>
'use strict';
const CURRICULUM=__CURRICULUM__;
const STORAGE_KEY='growing-together-montessori-v1', SCHEMA=2;
const AREAS=CURRICULUM.areas, BASE=CURRICULUM.lessons, SKILLS=CURRICULUM.skills;
const PAI={P:'Presented to child',A:'Assistance required',I:'Independent work in this observation'};
const STATUSES={interest:'Interest observed',presented:'Presented',practicing:'Practicing',independent:'Independent in observation',revisit:'Revisit / offer support'};
const STAGES=['Exploring','Developing','Extending'];
const VIEWS={dashboard:'Overview',children:'Children',curriculum:'Lesson library',planner:'Weekly plan',observations:'Observations',progress:'Progress record',records:'Three-year record',reports:'Reports',guide:'Guide & backups'};
let memoryOnly=false, storageProblem='',activeView='dashboard',selectedChild='',search='',areaFilter='',stageFilter='',observationFilter='',showArchived=false,week=weekStart(today()),reportFrom=today().slice(0,7)+'-01',reportTo=today();
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDay(s){return new Date(s+'T12:00:00')}
function dayAdd(s,n){const d=parseDay(s);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function weekStart(s){const d=parseDay(s);return dayAdd(s,-((d.getDay()+6)%7))}
function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(parseDay(s).getTime())&&dayAdd(s,0)===s}
function dateLabel(s,opts={month:'short',day:'numeric',year:'numeric'}){return validDate(s)?parseDay(s).toLocaleDateString(undefined,opts):'—'}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function age(dob){if(!validDate(dob))return 'Age not recorded';let months=(parseDay(today()).getFullYear()-parseDay(dob).getFullYear())*12+parseDay(today()).getMonth()-parseDay(dob).getMonth();if(parseDay(today()).getDate()<parseDay(dob).getDate())months--;return `${Math.floor(months/12)}y ${months%12}m`}
function blank(){return {schemaVersion:SCHEMA,children:[],plans:[],observations:[],customLessons:[]}}
function assert(ok,msg){if(!ok)throw Error(msg)}
function validate(data){
 if(data?.schemaVersion===1)data=migrateLegacy(data);
 assert(data&&data.schemaVersion===SCHEMA,'Unsupported backup version.');
 for(const key of ['children','plans','observations','customLessons'])assert(Array.isArray(data[key])&&data[key].length<=20000,'Invalid or oversized '+key+'.');
 const ids={};for(const key of ['children','plans','observations','customLessons']){ids[key]=new Set();for(const row of data[key]){assert(row&&typeof row.id==='string'&&/^[A-Za-z0-9_-]{1,100}$/.test(row.id)&&!ids[key].has(row.id),'Invalid or duplicate record ID.');ids[key].add(row.id);for(const [k,v] of Object.entries(row)){if(typeof v==='string')assert(v.length<=15000,'A text field is too long.');}}}
 const text=(r,keys)=>keys.every(k=>typeof r[k]==='string');
 for(const c of data.children){
 assert(Array.isArray(c.yearBounds)&&(c.yearBounds.length===0||(c.yearBounds.length===4&&c.yearBounds.every(validDate)&&c.yearBounds.every((d,i)=>i===0||d>c.yearBounds[i-1])&&c.yearBounds[0]>=c.dob)),'Use four increasing valid dates for the three-year record, or leave all four blank.');assert(text(c,['name','dob','start','language','strengths','interests','supports','teacher'])&&c.name.trim().length>0&&c.name.length<=100&&validDate(c.dob)&&c.dob<=today()&&validDate(c.start)&&typeof c.archived==='boolean','Invalid child record.');}
 for(const l of data.customLessons){assert(!BASE.some(b=>b.id===l.id)&&text(l,['title','area','stage','aim','materials','readiness','interest','control','observe','nextStep','safety'])&&l.title.trim()&&AREAS.some(a=>a.id===l.area)&&STAGES.includes(l.stage)&&Array.isArray(l.steps)&&l.steps.length>0&&l.steps.length<=30&&l.steps.every(x=>typeof x==='string'&&x.length<=3000),'Invalid custom lesson.');}
 const lessonIds=new Set([...BASE.map(l=>l.id),...ids.customLessons]);
 for(const p of data.plans){assert(validSkillLink(p),'Plan skill does not match its lesson.');assert(Array.isArray(p.childIds)&&p.childIds.length>0&&new Set(p.childIds).size===p.childIds.length&&p.childIds.every(id=>ids.children.has(id))&&lessonIds.has(p.lessonId)&&validDate(p.date)&&text(p,['workCycle','focus','materials','notes'])&&['planned','ready','presented','deferred'].includes(p.status),'Invalid lesson plan or missing linked record.');}
 for(const o of data.observations){assert(o.pai!=='A'||(typeof o.independence==='string'&&o.independence.trim().length>0),'Describe the support actually needed for an A (assistance) tag.');assert(!o.pai||({P:['presented'],A:['presented','practicing','revisit'],I:['independent']}[o.pai]||[]).includes(o.status),'P/A/I tag and observation status do not agree.');assert(validSkillLink(o)&&typeof o.pai==='string'&&(o.pai===''||Object.hasOwn(PAI,o.pai))&&typeof o.followUpDate==='string'&&(o.followUpDate===''||(validDate(o.followUpDate)&&o.followUpDate>=o.date)),'Invalid skill, P/A/I tag or follow-up date.');assert(ids.children.has(o.childId)&&lessonIds.has(o.lessonId)&&validDate(o.date)&&o.date<=today()&&Object.hasOwn(STATUSES,o.status)&&text(o,['context','objective','engagement','independence','nextStep','teacher','createdAt'])&&o.objective.trim()&&/^\d{4}-\d{2}-\d{2}T/.test(o.createdAt)&&!Number.isNaN(Date.parse(o.createdAt)),'Invalid observation or missing linked record.');}
 return {schemaVersion:SCHEMA,children:data.children,plans:data.plans,observations:data.observations,customLessons:data.customLessons};
}
let state=blank();try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)state=validate(JSON.parse(raw));else{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}}catch(e){memoryOnly=true;storageProblem='Device storage could not be read or initialized. Existing saved data has not been replaced. This session is temporary: export a backup before closing. '+e.message;}
function commit(change){const next=JSON.parse(JSON.stringify(state));change(next);try{validate(next);if(!memoryOnly)localStorage.setItem(STORAGE_KEY,JSON.stringify(next));state=next;return true}catch(e){alert('The change was not saved. '+e.message+' Export a backup of your current records, then free device storage if needed.');return false}}
function lessons(){return [...BASE,...state.customLessons]}
function lesson(id){return lessons().find(l=>l.id===id)}
function child(id){return state.children.find(c=>c.id===id)}
function activeChildren(){return state.children.filter(c=>!c.archived)}
function areaName(id){return AREAS.find(a=>a.id===id)?.title||id}
function latest(childId,lessonId,until=today()){return state.observations.filter(o=>o.childId===childId&&o.lessonId===lessonId&&o.date<=until).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt)||b.id.localeCompare(a.id))[0]}
function badge(status){return status?`<span class="pill ${esc(status)}">${esc(STATUSES[status])}</span>`:'<span class="muted small">Not recorded</span>'}
function empty(text,action=''){return `<div class="empty"><p>${esc(text)}</p>${action}</div>`}
function options(items,current){return items.map(([v,t])=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(t)}</option>`).join('')}
function childOptions(current,all=false){return options((all?state.children:activeChildren()).map(c=>[c.id,c.name+(c.archived?' (archived)':'')]),current)}
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,4000)}
function closeDialog(){document.querySelector('#dialog').close()}
function dialog(title,body){const d=document.querySelector('#dialog');d.innerHTML=`<div class="dialog-head"><h2 id="dialogTitle">${esc(title)}</h2><button type="button" data-action="close" aria-label="Close dialog">✕</button></div>${body}`;if(!d.open)d.showModal();}
function head(title,desc,actions=''){return `<div class="page-head"><div><h1>${esc(title)}</h1><p class="muted">${esc(desc)}</p></div><div class="actions no-print">${actions}</div></div>`}
function btn(action,label,extra='',primary=false){return `<button type="button" data-action="${action}" ${extra} class="${primary?'primary':''}">${esc(label)}</button>`}
function go(view){activeView=view;render();window.scrollTo(0,0)}
function render(){document.querySelector('#nav').innerHTML=Object.entries(VIEWS).map(([v,t])=>`<button data-view="${v}" class="${v===activeView?'active':''}" ${v===activeView?'aria-current="page"':''}>${t}</button>`).join('');document.querySelector('#saveBadge').textContent=memoryOnly?'Temporary session — export to keep':'Saved on this device';document.querySelector('#storageWarning').innerHTML=storageProblem?`<div class="notice error">${esc(storageProblem)}</div>`:'';document.querySelector('#app').innerHTML=({dashboard:dashboard,children:childrenView,curriculum:curriculumView,planner:plannerView,observations:observationsView,progress:progressView,records:recordsView,reports:reportsView,guide:guideView}[activeView])();}
function dashboard(){const kids=activeChildren(), recent=state.observations.filter(o=>o.date>=dayAdd(today(),-6)&&o.date<=today()&&!child(o.childId)?.archived);const pending=state.plans.filter(p=>p.date>=today()&&p.date<=dayAdd(today(),6)&&p.status!=='presented'&&p.status!=='deferred');const follow=kids.flatMap(c=>lessons().map(l=>latest(c.id,l.id))).filter(o=>o?.status==='revisit');return head('Room to grow','A clear view of what you have planned, what you have noticed, and what to offer next.',btn('child-new','Add a child','',true)+btn('observation-new','Record an observation'))+`<div class="stats"><div class="stat"><strong>${kids.length}</strong><span>Active children</span></div><div class="stat"><strong>${pending.length}</strong><span>Plans · next 7 days</span></div><div class="stat"><strong>${recent.length}</strong><span>Observations · last 7 days</span></div><div class="stat"><strong>${follow.length}</strong><span>Latest records suggesting a revisit</span></div></div>`+(!kids.length?empty('Start with a child profile. The lesson library is ready to explore.',btn('child-new','Add your first child','',true)+btn('demo','Try fictional sample records')):'')+`<div class="grid"><section class="panel"><h2>Next invitations</h2>${pending.length?pending.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(p=>`<div class="record"><div class="kicker">${dateLabel(p.date)}</div><h3>${esc(lesson(p.lessonId)?.title)}</h3><p>${esc(p.childIds.map(id=>child(id)?.name).join(', '))}</p><p>${esc(p.focus||'Follow the child’s current readiness and interest.')}</p>${btn('plan-edit','Open plan',`data-id="${p.id}"`)}</div>`).join(''):'<p class="muted">No upcoming invitations yet. Keep plans flexible and protect time for self-chosen work.</p>'}${btn('go-planner','Open weekly plan')}</section><section class="panel"><h2>Observe → offer → revisit</h2><ol><li>Watch before intervening. Write what the child actually did or said.</li><li>Choose a purposeful next invitation based on that evidence.</li><li>Present briefly, then allow repetition and choice.</li><li>Record the support needed and return to observe on another day.</li></ol><div class="notice">An independent performance is one dated observation. It is not a permanent mastery label or an age-based score.</div>${btn('go-guide','Read the teaching guide')}</section></div><section class="panel"><h2>Six connected areas</h2><div class="grid">${AREAS.map(a=>`<div><div class="kicker">${esc(a.title)}</div><p class="small muted">${esc(a.goal)}</p></div>`).join('')}</div></section>`}
function childrenView(){const list=state.children.filter(c=>showArchived||!c.archived);return head('Children','Keep a useful profile of each child’s strengths, interests, language and support needs.',btn('child-new','Add a child','',true))+`<div class="toolbar no-print"><label class="inline-label"><input type="checkbox" id="archivedToggle" ${showArchived?'checked':''}> Show archived children</label></div>`+(list.length?`<div class="grid">${list.map(c=>`<article class="card"><div class="flex"><h2>${esc(c.name)}</h2>${c.archived?'<span class="pill">Archived</span>':''}</div><p class="muted">${esc(age(c.dob))} · Joined ${dateLabel(c.start)}</p><p><strong>Interests</strong><br><span class="flow-text">${esc(c.interests||'Not recorded yet')}</span></p><p><strong>Strengths</strong><br><span class="flow-text">${esc(c.strengths||'Not recorded yet')}</span></p><p class="small muted">${state.observations.filter(o=>o.childId===c.id).length} observations · ${state.plans.filter(p=>p.childIds.includes(c.id)).length} plans</p><div class="actions">${btn('child-edit','Edit profile',`data-id="${c.id}"`)}${btn('child-progress','Progress',`data-id="${c.id}"`)}${btn('child-archive',c.archived?'Restore child':'Archive',`data-id="${c.id}"`)}</div></article>`).join('')}</div>`:empty('No active child profiles yet.',btn('child-new','Add a child','',true)))}
function field(label,name,value='',type='text',attrs=''){return `<label>${esc(label)}<input name="${name}" type="${type}" value="${esc(value)}" ${attrs}></label>`}
function textField(label,name,value='',attrs=''){return `<label ${attrs}>${esc(label)}<textarea name="${name}" maxlength="5000">${esc(value)}</textarea></label>`}
function formFoot(label='Save'){return `<div class="dialog-foot">${btn('close','Cancel')}<button class="primary" type="submit">${esc(label)}</button></div>`}
function childForm(id){const c=child(id)||{name:'',dob:'',start:today(),language:'',strengths:'',interests:'',supports:'',teacher:''};dialog(id?'Edit child profile':'Add a child',`<form id="childForm" data-id="${esc(id||'')}"><div class="form-grid">${field('Child name or preferred identifier *','name',c.name,'text','required maxlength="100" autocomplete="off"')}${field('Date of birth *','dob',c.dob,'date',`required max="${today()}"`)}${field('Enrollment date *','start',c.start,'date','required')}${field('Guide / key teacher','teacher',c.teacher,'text','maxlength="120"')}${field('Home language(s) and communication','language',c.language,'text','maxlength="500"')}${textField('Strengths and what brings confidence','strengths',c.strengths)}${textField('Current interests','interests',c.interests)}${textField('Access needs and useful teaching supports','supports',c.supports)}</div><p class="small muted">Use only information needed for teaching. Keep medical, safeguarding and formal support records in the program’s approved system.</p>${formFoot()}</form>`)}
function curriculumView(){let list=lessons().filter(l=>(!areaFilter||l.area===areaFilter)&&(!stageFilter||l.stage===stageFilter)&&(!search||[l.title,l.materials,l.readiness,l.observe].join(' ').toLowerCase().includes(search.toLowerCase())));return head('Lesson library','126 planning outlines plus 766 photo-aligned exercise variations, with room to add your own. Readiness matters more than age.',btn('lesson-new','Add a custom lesson','',true))+`<div class="toolbar no-print"><label><span class="visually-hidden">Search lessons</span><input id="lessonSearch" type="search" placeholder="Search a lesson or material…" value="${esc(search)}"></label><label>Area<select id="areaFilter"><option value="">All areas</option>${options(AREAS.map(a=>[a.id,a.title]),areaFilter)}</select></label><label>Sequence<select id="stageFilter"><option value="">All stages</option>${options(STAGES.map(x=>[x,x]),stageFilter)}</select></label></div><p class="small muted">${list.length} lessons shown · Exploring, Developing and Extending describe a flexible sequence, not age bands.</p><div class="grid">${list.map(l=>`<article class="card"><div class="kicker">${esc(areaName(l.area))} ${l.custom?'· Custom':''}</div><h3>${esc(l.title)}</h3><span class="readiness">${esc(l.stage)}</span><p>${esc(l.readiness)}</p><p class="small muted"><strong>Observe:</strong> ${esc(l.observe)}</p><div class="actions">${btn('lesson-view','Lesson details',`data-id="${l.id}"`)}${btn('plan-from-lesson','Plan',`data-id="${l.id}"`)}</div></article>`).join('')}</div>`+(list.length?'':empty('No matching lessons. Try another search or filter.'))}
function lessonDetail(id){const l=lesson(id);if(!l)return;dialog(l.title,`<div class="lesson-detail"><p><span class="pill">${esc(areaName(l.area))}</span> <span class="pill">${esc(l.stage)}</span></p><dl><dt>Direct aim</dt><dd>${esc(l.aim)}</dd><dt>Readiness / prior experience</dt><dd>${esc(l.readiness)}</dd><dt>Materials</dt><dd>${esc(l.materials)}</dd></dl><h3>Presentation outline</h3><p class="small muted">Invite, name the work and prepare the space. Show the movements slowly with minimal unnecessary speech. Pause for the child to choose whether to continue; demonstrate restoring the work when needed.</p><ol>${l.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><dl><dt>Point of interest</dt><dd>${esc(l.interest)}</dd><dt>Feedback / control of error</dt><dd>${esc(l.control)}</dd><dt>What to observe</dt><dd>${esc(l.observe)}</dd><dt>Possible next invitation</dt><dd>${esc(l.nextStep)}</dd><dt>Safety & access</dt><dd>${esc(l.safety)}</dd></dl><div class="notice">A concise planning aid for trained staff. Adapt to the actual child, language, material and program. A lesson is an invitation, not a required performance.</div><div class="actions">${btn('plan-from-lesson','Plan this lesson',`data-id="${id}"`,true)}${btn('observe-from-lesson','Record an observation',`data-id="${id}"`)}${l.custom?btn('lesson-edit','Edit custom lesson',`data-id="${id}"`):''}</div></div>`)}
function lessonForm(id){const l=state.customLessons.find(l=>l.id===id)||{title:'',area:'practical',stage:'Exploring',aim:'',materials:'',readiness:'',steps:[''],interest:'',control:'',observe:'',nextStep:'',safety:''};dialog(id?'Edit custom lesson':'Add a custom lesson',`<form id="lessonForm" data-id="${esc(id||'')}"><div class="form-grid">${field('Lesson title *','title',l.title,'text','required maxlength="200"')}<label>Area<select name="area">${options(AREAS.map(a=>[a.id,a.title]),l.area)}</select></label><label>Sequence<select name="stage">${options(STAGES.map(x=>[x,x]),l.stage)}</select></label>${textField('Direct aim *','aim',l.aim)}${textField('Materials *','materials',l.materials)}${textField('Readiness and prior experience *','readiness',l.readiness)}${textField('Presentation steps · one per line *','steps',l.steps.join('\n'))}${textField('Point of interest','interest',l.interest)}${textField('Feedback / control of error','control',l.control)}${textField('What to observe *','observe',l.observe)}${textField('Possible next invitation','nextStep',l.nextStep)}${textField('Safety and access considerations','safety',l.safety)}</div>${formFoot()}</form>`);for(const name of ['aim','materials','readiness','steps','observe'])document.querySelector(`#lessonForm [name=${name}]`).required=true;}
function plannerView(){const days=Array.from({length:7},(_,i)=>dayAdd(week,i));return head('Weekly plan','Plan a few thoughtful invitations. Leave room for repetition, spontaneous interests and uninterrupted self-chosen work.',btn('plan-new','Plan a lesson','',true)+btn('print','Print this week'))+`<div class="toolbar no-print">${btn('previous-week','← Previous')}<label>Week containing<input type="date" id="weekDate" value="${week}"></label>${btn('next-week','Next →')}${btn('this-week','This week')}<label>Child<select id="plannerChild"><option value="">All active children</option>${childOptions(selectedChild,true)}</select></label></div><div class="print-only"><h1>Weekly Montessori plan</h1><p>${dateLabel(week)} – ${dateLabel(dayAdd(week,6))}</p></div><section class="panel">${days.map(date=>{const ps=state.plans.filter(p=>p.date===date&&(!selectedChild?p.childIds.some(id=>!child(id)?.archived):p.childIds.includes(selectedChild))).sort((a,b)=>a.workCycle.localeCompare(b.workCycle));return `<div class="day"><div><h3>${dateLabel(date,{weekday:'long'})}</h3><span class="small muted">${dateLabel(date,{month:'short',day:'numeric'})}</span></div><div>${ps.length?ps.map(p=>`<article class="plan ${p.status}"><div class="flex"><h3>${esc(lesson(p.lessonId)?.title)}</h3><span class="pill">${esc(p.status)}</span></div>${p.skillId?`<p class="source-tag">Specific variation: ${esc(skill(p.skillId)?.title)}</p>`:''}<p><strong>${esc(p.childIds.map(id=>child(id)?.name).join(', '))}</strong> · ${esc(p.workCycle)}</p><p class="flow-text">${esc(p.focus||'Observe readiness before offering the lesson.')}</p>${p.materials?`<p class="small"><strong>Prepare:</strong> ${esc(p.materials)}</p>`:''}${p.notes?`<p class="small flow-text">${esc(p.notes)}</p>`:''}<div class="actions no-print">${btn('plan-edit','Edit',`data-id="${p.id}"`)}${btn('lesson-view','Presentation',`data-id="${p.lessonId}"`)}${btn('plan-observe','Record outcome',`data-id="${p.id}"`)}</div></article>`).join(''):'<p class="muted small">Open space for child-chosen work and observation.</p>'}</div></div>`}).join('')}</section><p class="tab-note muted">Marking a plan “presented” does not create a progress record. Use “Record outcome” for a dated observation of each child; a group plan needs individual evidence for each participant.</p>`}
function planForm(id,lessonId,childId){if(!activeChildren().length&&!id){toast('Add a child profile before planning a lesson.');closeDialog();go('children');return}const p=state.plans.find(p=>p.id===id)||{lessonId:lessonId||lessons()[0].id,childIds:childId?[childId]:selectedChild?[selectedChild]:[],date:weekStart(today())===week?today():week,workCycle:'Morning work cycle',focus:'',materials:lesson(lessonId||lessons()[0].id)?.materials||'',notes:'',status:'planned'};const kids=state.children.filter(c=>!c.archived||p.childIds.includes(c.id));dialog(id?'Edit lesson plan':'Plan a lesson',`<form id="planForm" data-id="${esc(id||'')}"><div class="form-grid"><label class="full">Lesson *<select name="lessonId" required>${options(lessons().map(l=>[l.id,areaName(l.area)+' · '+l.title]),p.lessonId)}</select></label><fieldset class="full"><legend>Child / small group *</legend><div class="checks">${kids.map(c=>`<label><input type="checkbox" name="childIds" value="${c.id}" ${p.childIds.includes(c.id)?'checked':''}>${esc(c.name)}${c.archived?' (archived)':''}</label>`).join('')}</div></fieldset>${field('Date *','date',p.date,'date','required')}<label>Work period<select name="workCycle">${options(['Morning work cycle','Afternoon work cycle','Outdoor / community','Flexible invitation'].map(x=>[x,x]),p.workCycle)}</select></label><label>Status<select name="status">${options(['planned','ready','presented','deferred'].map(x=>[x,x]),p.status)}</select></label>${textField('Why this invitation? Link it to an observation.','focus',p.focus)}${textField('Materials / preparation','materials',p.materials)}${textField('Adaptations, group arrangement and notes','notes',p.notes)}</div>${formFoot()}${id?btn('plan-delete','Delete plan',`data-id="${id}"`):''}</form>`)}
function observationsView(){const list=state.observations.filter(o=>(!selectedChild||o.childId===selectedChild)&&(!observationFilter||o.status===observationFilter)).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));return head('Observations','Record what happened, the support given and the next useful invitation. Keep interpretation separate from evidence.',btn('observation-new','Record observation','',true))+`<div class="toolbar no-print"><label>Child<select id="observationChild"><option value="">All children</option>${childOptions(selectedChild,true)}</select></label><label>Record status<select id="observationStatus"><option value="">All statuses</option>${options(Object.entries(STATUSES),observationFilter)}</select></label></div><section class="panel">${list.length?list.map(o=>recordMarkup(o,true)).join(''):empty('No observations match this view. A brief factual note is a useful place to start.')}</section>`}
function recordMarkup(o,edit=false){return `<article class="record"><div class="flex"><div><span class="small muted">${dateLabel(o.date)} · ${esc(child(o.childId)?.name)}</span><h3>${esc(lesson(o.lessonId)?.title)}</h3></div>${badge(o.status)}</div>${o.skillId?`<p class="source-tag">${esc(skill(o.skillId)?.title)} · ${esc(o.pai?o.pai+' — '+PAI[o.pai]:'No P/A/I tag')}</p>`:''}<p class="flow-text"><strong>Observed:</strong> ${esc(o.objective)}</p>${o.context?`<p class="flow-text"><strong>Context:</strong> ${esc(o.context)}</p>`:''}${o.independence?`<p class="flow-text"><strong>Support:</strong> ${esc(o.independence)}</p>`:''}${o.engagement?`<p class="flow-text"><strong>Engagement:</strong> ${esc(o.engagement)}</p>`:''}${o.nextStep?`<p class="flow-text"><strong>Next invitation:</strong> ${esc(o.nextStep)}</p>`:''}${o.followUpDate?`<p class="small"><strong>Follow-up invitation:</strong> ${dateLabel(o.followUpDate)}</p>`:''}${o.teacher?`<p class="small muted">Recorded by ${esc(o.teacher)}</p>`:''}${edit?`<div class="actions no-print">${btn('observation-edit','Edit record',`data-id="${o.id}"`)}${btn('plan-from-observation','Plan next invitation',`data-id="${o.id}"`)}</div>`:''}</article>`}
function observationForm(id,lessonId,childId,planId){if(!state.children.length){toast('Add a child profile before recording an observation.');closeDialog();go('children');return}const plan=state.plans.find(p=>p.id===planId);const o=state.observations.find(o=>o.id===id)||{childId:childId||selectedChild||plan?.childIds[0]||activeChildren()[0]?.id||state.children[0].id,lessonId:lessonId||plan?.lessonId||lessons()[0].id,date:plan&&plan.date<=today()?plan.date:today(),status:'presented',context:plan?.focus||'',objective:'',engagement:'',independence:'',nextStep:'',teacher:''};dialog(id?'Edit observation':'Record an observation',`<form id="observationForm" data-id="${esc(id||'')}" data-plan="${esc(planId||'')}"><div class="form-grid"><label>Child *<select name="childId" required>${childOptions(o.childId,true)}</select></label>${field('Observation date *','date',o.date,'date',`required max="${today()}"`)}<label class="full">Lesson / work *<select name="lessonId">${options(lessons().map(l=>[l.id,areaName(l.area)+' · '+l.title]),o.lessonId)}</select></label><label>Observed status<select name="status">${options(Object.entries(STATUSES),o.status)}</select></label>${field('Recorded by','teacher',o.teacher||child(o.childId)?.teacher||'','text','maxlength="120"')}${textField('Context / invitation','context',o.context)}<label>What did you see or hear? *<textarea name="objective" required maxlength="5000" placeholder="Example: Poured water twice. On the second attempt, stopped before the cup filled and wiped one spill without a reminder.">${esc(o.objective)}</textarea></label>${textField('Support actually needed','independence',o.independence)}${textField('Engagement and child’s response','engagement',o.engagement)}${textField('Possible next invitation / follow-up','nextStep',o.nextStep)}</div><p class="small muted">Presented = a lesson was offered and demonstrated. Independent = performed without the recorded adult support in this observation. A declined invitation can be documented under interest or revisit; it is not a failure.</p>${plan?'<div class="notice">This records one child’s outcome. Update the group plan status separately, and record other participants individually.</div>':''}${formFoot('Save observation')}${id?btn('observation-delete','Delete record',`data-id="${id}"`):''}</form>`)}
function ensureSelected(){if(!child(selectedChild))selectedChild=activeChildren()[0]?.id||state.children[0]?.id||'';return child(selectedChild)}
function progressView(){const c=ensureSelected();return head('Progress record','The latest dated observation linked to each planning outline. A specific variation does not establish independence across the whole lesson family; use the three-year record for separate exercises.',btn('print','Print record'))+`<div class="toolbar no-print"><label>Child<select id="progressChild">${childOptions(selectedChild,true)}</select></label><label>Area<select id="progressArea"><option value="">All areas</option>${options(AREAS.map(a=>[a.id,a.title]),areaFilter)}</select></label></div>`+(!c?empty('Add a child to begin an individual progress record.'): `<div class="print-only"><h1>Montessori progress record</h1><p>${esc(c.name)} · As of ${dateLabel(today())}</p></div><section class="panel"><h2>${esc(c.name)}</h2><p class="muted">${esc(age(c.dob))} · ${esc(c.language||'Home language not recorded')}</p><div class="grid">${AREAS.map(a=>{const ls=lessons().filter(l=>l.area===a.id),n=ls.filter(l=>latest(c.id,l.id)).length;return `<div><h3>${esc(a.title)}</h3><div class="area-bar"><span style="width:${n/ls.length*100}%"></span></div><span class="small muted">${n} of ${ls.length} library lessons have an observation</span></div>`}).join('')}</div><p class="small muted">These bars show record coverage only, not attainment, expected pace or a comparison with other children.</p></section><section class="panel table-scroll"><table class="progress-grid"><thead><tr><th>Lesson</th><th>Latest status</th><th>Date</th><th>Support / next invitation</th><th class="no-print">Action</th></tr></thead><tbody>${lessons().filter(l=>!areaFilter||l.area===areaFilter).map(l=>{const o=latest(c.id,l.id);return `<tr><td><strong>${esc(l.title)}</strong><br><span class="small muted">${esc(areaName(l.area))}</span></td><td>${badge(o?.status)}</td><td>${o?dateLabel(o.date):'—'}</td><td class="flow-text">${esc(o?.nextStep||o?.independence||'—')}</td><td class="no-print">${btn('observe-specific','Add note',`data-child="${c.id}" data-id="${l.id}"`)}</td></tr>`}).join('')}</tbody></table></section>`)}
function reportsView(){const c=ensureSelected();const valid=validDate(reportFrom)&&validDate(reportTo)&&reportFrom<=reportTo&&reportTo<=today();const obs=c&&valid?state.observations.filter(o=>o.childId===c.id&&o.date>=reportFrom&&o.date<=reportTo).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt.localeCompare(b.createdAt)):[];return head('Individual learning report','Review this staff record before sharing. Choose a date range, print to paper or PDF, or export the observations as CSV.',btn('print','Print / save PDF')+btn('csv','Export observations CSV'))+`<div class="toolbar no-print"><label>Child<select id="reportChild">${childOptions(selectedChild,true)}</select></label><label>From<input id="reportFrom" type="date" value="${esc(reportFrom)}" max="${today()}"></label><label>Through<input id="reportTo" type="date" value="${esc(reportTo)}" max="${today()}"></label></div>`+(!c?empty('Add a child and observations to create a report.'):!valid?'<div class="notice error">Choose a valid date range ending on or before today.</div>':`<section class="panel report-sheet"><div class="report-title"><div class="kicker">Growing Together · Montessori 3–6</div><h1>${esc(c.name)}</h1><p>${dateLabel(reportFrom)} – ${dateLabel(reportTo)} · ${obs.length} recorded observations</p></div><h3>Current profile</h3><p class="small muted">Profile fields reflect the current profile, not a historical snapshot of the selected period.</p><p class="flow-text"><strong>Strengths:</strong> ${esc(c.strengths||'Not recorded')}</p><p class="flow-text"><strong>Interests:</strong> ${esc(c.interests||'Not recorded')}</p><p class="flow-text"><strong>Language / communication:</strong> ${esc(c.language||'Not recorded')}</p><div class="notice no-print">Staff working report: check names, quotes and sensitive context before sharing. Teaching support notes from the profile are omitted; observation text is included as entered.</div>${AREAS.map(a=>{const rows=obs.filter(o=>lesson(o.lessonId)?.area===a.id);return `<section class="report-area"><h2>${esc(a.title)}</h2>${rows.length?rows.map(o=>recordMarkup(o)).join(''):'<p class="small muted">No observations recorded in this period. This does not establish that the child did no work in this area.</p>'}</section>`}).join('')}<p class="small muted">Statuses describe individual dated observations. This record does not provide a standardized assessment, diagnosis, guaranteed readiness for school or a permanent mastery judgment.</p></section>`)}
function guideView(){return head('A thoughtful working system','Use the records to improve teaching decisions. Keep the child’s choice, dignity and long work cycle at the center.')+`<section class="panel"><h2>Keep a copy you can restore</h2><p>Records stay in this browser profile on this device. They are not uploaded, shared across devices, encrypted by this tool or automatically backed up. Clearing browser data, using private mode, moving the HTML file or changing browsers can make records unavailable.</p><div class="actions">${btn('backup','Export full backup','',true)}${btn('import','Restore a backup')}${btn('csv-all','Export all observations CSV')}${btn('demo','Add fictional sample records')}</div><p class="small muted" style="margin-top:12px">A JSON backup restores profiles, custom lessons, plans and observations. CSV is for review in a spreadsheet and cannot restore the system. Protect both files as child records. Restore replaces the current dataset after confirmation; it first downloads a copy of current records.</p></section><section class="panel"><h2>A flexible three-year journey</h2><div class="grid"><div><h3>Exploring</h3><p>Belonging, routines, movement, practical life, sensory exploration, oral language and concrete quantities. Offer simple purposeful work and observe what draws the child back.</p></div><div><h3>Developing</h3><p>Longer sequences, finer comparisons, sound-symbol relationships, composing words, connecting numbers and quantities, and sustained inquiry. Continue familiar work alongside new invitations.</p></div><div><h3>Extending</h3><p>Reading for meaning, purposeful writing, decimal operations with materials, cultural investigations, collaboration and creative projects. Offer greater complexity when prior understanding is observable.</p></div></div><div class="notice">These are teaching sequence descriptions, not age groups. Children may be exploring in one area and extending in another. All three stages can coexist in a mixed-age room.</div></section><section class="panel"><h2>The planning rhythm</h2><ol><li><strong>Prepare the environment.</strong> Check complete materials, accessible shelving, clear pathways and safe choices. Include familiar work in every area.</li><li><strong>Observe before planning.</strong> Note the child’s interest, prior experience, language and movement. Separate a fact from an interpretation.</li><li><strong>Choose a few invitations.</strong> Link a plan to evidence. Individual and small-group presentations can coexist with a long, protected work period; avoid turning the morning into a rotation schedule.</li><li><strong>Present with care.</strong> Invite rather than insist. Show a clear sequence and its restoration. Use the material’s feedback without pretending every activity is self-correcting.</li><li><strong>Step back.</strong> Allow repetition and concentration. Intervene for safety, misuse or meaningful support, using the least help needed.</li><li><strong>Record and revisit.</strong> Write a brief dated observation. Plan a useful next opportunity; repeated independent performances across time and contexts are stronger evidence than one event.</li></ol></section><section class="panel"><h2>What the record labels mean</h2>${Object.entries(STATUSES).map(([k,v])=>`<p>${badge(k)} ${esc({interest:'The child noticed or chose related work. This does not establish performance.',presented:'A lesson was offered and demonstrated. The child may still need repeated presentations.',practicing:'The child is working with the material; record the actual help and errors.',independent:'The child worked without the noted adult support in this particular observation. Keep observing over time.',revisit:'Another invitation, a different material or additional support may be helpful. Record why without labeling the child.'}[k])}</p>`).join('')}<p>“Not recorded” means there is no linked observation. It does not mean incapable, absent, behind or not introduced elsewhere. The progress view chooses the newest observation date, then the most recently created record for a same-day tie. Editing an older record does not silently make it the newest event.</p></section><section class="panel"><h2>Write evidence, not judgments</h2><p><strong>Useful:</strong> “Matched five color pairs. Compared the final two twice, then changed one pair without a prompt.”</p><p><strong>Less useful:</strong> “Very smart, mastered colors.”</p><p><strong>Useful:</strong> “Watched the zipper demonstration, declined a turn, and chose table washing. Offer the frame again near coat time.”</p><p><strong>Less useful:</strong> “Refuses practical life.”</p></section><section class="panel"><h2>Scope, inclusion and professional judgment</h2><p>The 126 planning outlines and 766 source-aligned variations are a broad planning library, not a complete Montessori training album, an AMI/AMS-endorsed curriculum or a requirement for every child. Presentation details and sequences vary by training tradition, language and materials. A trained guide should review and adapt them.</p><p>Include home languages, adaptive tools, accessible movement and communication. Do not force sensory contact, speech, eye contact, public performance or fixed age targets. Document supports neutrally and coordinate individual plans through your program’s approved process.</p><p>This tool does not replace attendance, medication, incident, safeguarding, licensing or formal special-education records. Do not enter those records here. Use approved access-controlled systems when records must be shared among staff.</p><p>Professional reference routes for your review: <a href="https://amshq.org/" target="_blank" rel="noopener noreferrer">American Montessori Society</a>, <a href="https://montessori-ami.org/" target="_blank" rel="noopener noreferrer">Association Montessori Internationale</a>, and <a href="https://www.naeyc.org/resources/position-statements/dap" target="_blank" rel="noopener noreferrer">NAEYC developmentally appropriate practice</a>. These links are starting points; this edition has not been independently reviewed or endorsed by those organizations.</p></section><section class="panel"><h2>Daily and weekly checklist</h2><ul><li><strong>Before children arrive:</strong> prepare complete work, review access and safety, and choose a few possible invitations.</li><li><strong>During the work cycle:</strong> observe, give brief presentations, protect concentration and note the support actually used.</li><li><strong>At the end of the day:</strong> finish short factual records, restore materials and adjust tomorrow’s invitations.</li><li><strong>Each week:</strong> review children and areas with little recorded evidence without turning coverage into a quota; revisit follow-ups and export a backup.</li><li><strong>Before a conference:</strong> choose a date range, check the report, add family perspectives through your approved process and agree on a few practical next steps.</li></ul></section>`}
function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}

function exportCsv(all=false){if(!all&&(!selectedChild||!validDate(reportFrom)||!validDate(reportTo)||reportFrom>reportTo||reportTo>today())){toast('Choose a child and a valid report date range first.');return}const rows=state.observations.filter(o=>all||(o.childId===selectedChild&&o.date>=reportFrom&&o.date<=reportTo));const fields=['Child','Date','Area','Lesson','Observed status','Context','Objective observation','Support','Engagement','Next invitation','Recorded by','Skill ID','Specific variation','P/A/I tag','Follow-up date'];const data=rows.map(o=>[child(o.childId)?.name,o.date,areaName(lesson(o.lessonId)?.area),lesson(o.lessonId)?.title,STATUSES[o.status],o.context,o.objective,o.independence,o.engagement,o.nextStep,o.teacher,o.skillId,skill(o.skillId)?.title||'',o.pai,o.followUpDate]);download(`Montessori_Observations_${today()}.csv`,'\uFEFF'+[fields,...data].map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV download requested.');}

function ageAt(dob,date){if(!validDate(dob)||!validDate(date)||date<dob)return '—';let m=(parseDay(date).getFullYear()-parseDay(dob).getFullYear())*12+parseDay(date).getMonth()-parseDay(dob).getMonth();if(parseDay(date).getDate()<parseDay(dob).getDate())m--;return `${Math.floor(m/12)}y ${m%12}m`}

 return headText+controls+`<section class="panel"><div class="flex"><div><h2>${esc(c.name)}</h2><p class="small muted">Admitted ${dateLabel(c.start)} · ${esc(age(c.dob))} now · ${list.length} of ${SKILLS.length} tracking items shown</p></div><div class="no-print">${btn('child-edit','Set / edit record years',`data-id="${c.id}"`)}</div></div>${!hasYears?'<div class="notice">Set the four year boundaries in this child’s profile to place dates in Year 1, Year 2 and Year 3. Existing observations are preserved; no year assignment has been guessed.</div>':`<div class="grid">${[0,1,2].map(y=>`<p class="small"><strong>Year ${y+1}</strong> · Age ${esc(ageAt(c.dob,c.yearBounds[y]))} at start<br>${dateLabel(c.yearBounds[y])} – ${dateLabel(dayAdd(c.yearBounds[y+1],-1))}</p>`).join('')}</div>`}<p class="small muted"><strong>P</strong> Presented to child · <strong>A</strong> Assistance required · <strong>I</strong> Independent work in that observation. A cell shows the latest date for that tag in that year; × indicates multiple observations. Open a date for the full history. Tags do not expire or imply a required P→A→I order.</p>${outside?`<p class="small muted">${outside} linked observation(s) are ${hasYears?'outside these date periods':'waiting for year dates'}. They remain available in the observation history.</p>`:''}${recordLesson?`<p class="small">Filtered to planning outline: ${esc(lesson(recordLesson)?.title)}</p>`:''}<div class="table-scroll" role="region" aria-label="Three-year curriculum table; scroll horizontally on small screens" tabindex="0"><table class="pai-table"><thead><tr><th rowspan="2">Exercise / variation</th>${[1,2,3].map(y=>`<th colspan="3">Year ${y}</th>`).join('')}<th rowspan="2" class="no-print">Plan / record</th></tr><tr>${[1,2,3].map(()=>'<th>P</th><th>A</th><th>I</th>').join('')}</tr></thead><tbody>${list.map(s=>{const key=s.area+'|'+s.section;let section='';if(key!==lastSection){lastSection=key;section=`<tr class="pai-section"><td colspan="11">${esc(a const originalGuide=guideView;
guideView=function(){return `<section class="panel"><h2>What changed with your curriculum photos</h2><p>All 11 photographs were read visually. Their named exercises are mapped to 365 normalized source rows and 766 tracking items, including disclosed guide additions and ambiguous source wording; 54 new guide-authored outlines extend the original 72 lessons. Art stays in its own area in this tool, while its source photo calls it Culture. Photographed blank lines are left for your own additions.</p><p><strong>Three-year record:</strong> choose exact exercises, set the child’s four date boundaries, and record dated P, A or I evidence. An assistance tag requires a note about the actual help. A single observation adds one tag; it never fills the other tags automatically. Changing a child’s year dates redisplays the existing evidence without changing its date.</p><p><strong>Older data:</strong> version 1 backups and stored records are accepted and migrated in memory. Original IDs, notes, statuses and links remain. Record years and specific-skill links start blank. Old broad lesson observations do not prove the child completed all new variations.</p><p><strong>Upgrade:</strong> export a backup from the old file before replacing or moving it. The same browser origin/storage key can read its records directly; a differently located local file may need the old JSON backup imported through Restore. After successful restore, export a new version 2 backup.</p><p>The photos supply inventories and P/A/I columns, not presentation procedures or age deadlines. New outlines are original planning aids requiring a trained guide’s adaptation. Set numbers, paper colors and advanced extensions are not standardized requirements.</p></section>`+originalGuide();};
// Keep P/A/I and broader status coherent, while never inferring that practice needed assistance.
document.addEventListener('change',e=>{const t=e.target,f=t.form;if(f?.id==='observationForm'&&t.name==='pai'&&t.value){f.elements.status.value={P:'presented',A:'practicing',I:'independent'}[t.value];}if(f?.id==='observationForm'&&t.name==='status'&&f.elements.pai){f.elements.pai.value={presented:'P',independent:'I'}[t.value]||'';}});

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){go(b.dataset.view);return}const a=b.dataset.action,id=b.dataset.id;if(!a)return;switch(a){case'record-print':if(ensureSelected()?.yearBounds.length===4)window.print();else toast('Set the child’s three-year dates before printing this record.');break;case'record-export':exportRecordCsv();break;case'year-suggest':suggestYearDates();break;case'skill-plan':{const sk=skill(id);planForm(undefined,sk.lessonId,selectedChild||undefined,sk.id);break}case'skill-observe':{const sk=skill(id);observationForm(undefined,sk.lessonId,selectedChild||undefined,undefined,sk.id);break}case'skill-history':skillHistory(id);break;case'skill-details':skillDetail(id);break;case'lesson-variations':recordLesson=id;recordArea='';recordSection='';recordPhoto='';recordQuery='';go('records');break;case'record-clear':recordLesson='';recordQuery='';recordArea='';recordSection='';recordPhoto='';render();break;case'go-records':go('records');break;case'close':closeDialog();break;case'child-new':childForm();break;case'child-edit':childForm(id);break;case'child-archive':{const c=child(id);if(confirm(`${c.archived?'Restore':'Archive'} ${c.name}? Plans and observations will be kept.`)&&commit(s=>s.children.find(c=>c.id===id).archived=!c.archived)){render();toast(c.archived?'Child restored.':'Child archived; records retained.');}break}case'child-progress':selectedChild=id;go('progress');break;case'lesson-view':lessonDetail(id);break;case'lesson-new':lessonForm();break;case'lesson-edit':lessonForm(id);break;case'plan-new':planForm();break;case'plan-edit':planForm(id);break;case'plan-from-lesson':planForm(undefined,id);break;case'observe-from-lesson':observationForm(undefined,id);break;case'observe-specific':observationForm(undefined,id,b.dataset.child);break;case'observation-new':observationForm();break;case'observation-edit':observationForm(id);break;case'plan-observe':{const p=state.plans.find(p=>p.id===id);observationForm(undefined,p.lessonId,p.childIds[0],id);break}case'plan-from-observation':{const o=state.observations.find(o=>o.id===id);planForm(undefined,o.lessonId,o.childId,o.skillId);const f=document.querySelector('#planForm');if(f){f.elements.focus.value='Observation '+o.date+': '+o.objective+(o.nextStep?'\nPossible next invitation: '+o.nextStep:'');if(o.followUpDate)f.elements.date.value=o.followUpDate>=today()?o.followUpDate:today();}break}case'plan-delete':case'observation-delete':{const key=a==='plan-delete'?'plans':'observations';if(confirm('Delete this record permanently? Export a backup first if you may need it.')&&commit(s=>s[key]=s[key].filter(r=>r.id!==id))){closeDialog();render();toast('Record deleted.');}break}case'previous-week':week=dayAdd(week,-7);render();break;case'next-week':week=dayAdd(week,7);render();break;case'this-week':week=weekStart(today());render();break;case'go-planner':go('planner');break;case'go-guide':go('guide');break;case'print':window.print();break;case'backup':backup();break;case'import':document.querySelector('#importFile').click();break;case'csv':exportCsv();break;case'csv-all':exportCsv(true);break;case'demo':loadDemo();break;}});
document.addEventListener('change',e=>{const t=e.target;switch(t.id){case'recordChild':selectedChild=t.value;render();break;case'recordArea':recordArea=t.value;recordSection='';recordLesson='';render();break;case'recordSection':recordSection=t.value;render();break;case'recordPhoto':recordPhoto=t.value;render();break;case'archivedToggle':showArchived=t.checked;render();break;case'areaFilter':case'progressArea':areaFilter=t.value;render();break;case'stageFilter':stageFilter=t.value;render();break;case'weekDate':if(validDate(t.value))week=weekStart(t.value);render();break;case'plannerChild':case'observationChild':case'progressChild':case'reportChild':selectedChild=t.value;render();break;case'observationStatus':observationFilter=t.value;render();break;case'reportFrom':reportFrom=t.value;render();break;case'reportTo':reportTo=t.value;render();break;}if(t.name==='lessonId'&&['planForm','observationForm'].includes(t.form?.id)){refreshSkillChoices(t.form,t.value);}
if(t.name==='lessonId'&&t.form?.id==='planForm'){t.form.elements.materials.value=lesson(t.value)?.materials||'';}});
document.addEventListener('input',e=>{if(e.target.id==='recordQuery'){const pos=e.target.selectionStart;recordQuery=e.target.value;render();const input=document.querySelector('#recordQuery');input.focus();input.setSelectionRange(pos,pos);}
if(e.target.id==='lessonSearch'){const pos=e.target.selectionStart;search=e.target.value;render();const input=document.querySelector('#lessonSearch');input.focus();input.setSelectionRange(pos,pos);}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f),get=k=>String(fd.get(k)||'').trim(),id=f.dataset.id||uid();let saved=false;
 if(f.id==='childForm'){const old=child(id);const c={id,name:get('name'),dob:get('dob'),start:get('start'),teacher:get('teacher'),language:get('language'),strengths:get('strengths'),interests:get('interests'),supports:get('supports'),archived:old?.archived||false,yearBounds:['year1','year2','year3','yearEnd'].some(k=>get(k))?['year1','year2','year3','yearEnd'].map(get):[]};saved=commit(s=>{if(old)s.children[s.children.findIndex(c=>c.id===id)]=c;else s.children.push(c)});}
 if(f.id==='lessonForm'){const l={id,title:get('title'),area:get('area'),stage:get('stage'),aim:get('aim'),materials:get('materials'),readiness:get('readiness'),steps:get('steps').split('\n').map(x=>x.trim()).filter(Boolean),interest:get('interest'),control:get('control'),observe:get('observe'),nextStep:get('nextStep'),safety:get('safety'),custom:true};saved=commit(s=>{const i=s.customLessons.findIndex(l=>l.id===id);if(i>=0)s.customLessons[i]=l;else s.customLessons.push(l)});}
 if(f.id==='planForm'){const childIds=fd.getAll('childIds');if(!childIds.length){toast('Choose at least one child for the invitation.');return}const p={id,lessonId:get('lessonId'),skillId:get('skillId'),childIds,date:get('date'),workCycle:get('workCycle'),focus:get('focus'),materials:get('materials'),notes:get('notes'),status:get('status')};saved=commit(s=>{const i=s.plans.findIndex(p=>p.id===id);if(i>=0)s.plans[i]=p;else s.plans.push(p)});if(saved)week=weekStart(p.date);}
 if(f.id==='observationForm'){const old=state.observations.find(o=>o.id===id);const o={id,childId:get('childId'),lessonId:get('lessonId'),skillId:get('skillId'),pai:get('pai'),followUpDate:get('followUpDate'),date:get('date'),status:get('status'),context:get('context'),objective:get('objective'),engagement:get('engagement'),independence:get('independence'),nextStep:get('nextStep'),teacher:get('teacher'),createdAt:old?.createdAt||new Date().toISOString()};saved=commit(s=>{const i=s.observations.findIndex(o=>o.id===id);if(i>=0)s.observations[i]=o;else s.observations.push(o)});}
 if(saved){closeDialog();if(f.id==='planForm')activeView='planner';if(f.id==='observationForm')activeView='observations';render();toast(memoryOnly?'Kept in this session. Export a backup before closing.':'Saved on this device.');}});
document.querySelector('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{assert(file.size<=10*1024*1024,'Backup exceeds the 10 MB import limit.');const imported=validate(JSON.parse(await file.text()));const count=imported.children.length;if(!confirm(`Restore ${count} child profile(s), ${imported.plans.length} plan(s) and ${imported.observations.length} observation(s)? This REPLACES the current records. A backup download of current records will be requested first. Check that the download completes before closing the app.`))return;backup('Montessori_Before_Restore');if(commit(s=>Object.assign(s,imported))){selectedChild='';closeDialog();render();toast('Backup restored. Current records have been replaced.');}}catch(err){alert('Backup was not imported. Current records are unchanged. '+err.message)}});
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY&&!memoryOnly){try{state=e.newValue?validate(JSON.parse(e.newValue)):blank();closeDialog();render();toast('Records changed in another tab. This view has been refreshed.');}catch(err){storageProblem='Another tab changed records to an unreadable format. Export this tab’s records and reload only after checking your backup.';memoryOnly=true;render();}}});
render();
</script></body></html>
