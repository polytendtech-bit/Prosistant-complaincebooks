nmax(160px,1fr));gap:9px}.checks label{display:flex;gap:8px;align-items:center;font-weight:400}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}.flow-text{white-space:pre-wrap;overflow-wrap:anywhere}.table-scroll{overflow:auto;max-width:100%}table{border-collapse:collapse;width:100%;text-align:left;font-size:13px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}td button{padding:5px 9px}.day{display:grid;grid-template-columns:125px 1fr;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}.plan{padding:14px 16px;border:1px solid var(--line);border-left:4px solid #7e9e7e;border-radius:9px;background:white;margin-bottom:10px}.plan.deferred{border-left-color:#c49b5a}.plan.presented{border-left-color:#727da7}.plan p{font-size:13px;margin:6px 0}.record{border-bottom:1px solid var(--line);padding:18px 0}.record:last-child{border-bottom:0}.record p{margin:8px 0;font-size:14px}.progress-grid th:first-child,.progress-grid td:first-child{min-width:220px}.area-bar{height:7px;background:var(--pale);border-radius:5px;overflow:hidden;margin:8px 0}.area-bar span{display:block;height:100%;background:#698c6d}.lesson-heading{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.kicker{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}details{border-bottom:1px solid var(--line);padding:14px 0}summary{font-weight:600;cursor:pointer}dialog{border:1px solid var(--line);border-radius:16px;max-width:780px;width:calc(100% - 24px);max-height:90vh;padding:26px;color:var(--ink)}dialog::backdrop{background:#1c302777;backdrop-filter:blur(2px)}.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.dialog-head h2{margin-top:5px}.dialog-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:23px;position:sticky;bottom:-26px;background:white;padding:14px 0}.lesson-detail dl{display:grid;grid-template-columns:145px 1fr;gap:10px 18px}.lesson-detail dt{font-size:12px;font-weight:600;color:var(--muted)}.lesson-detail dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.lesson-detail ol{padding-left:24px}.lesson-detail li{padding:5px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:5;padding:12px 20px;background:var(--ink);color:white;border-radius:9px;max-width:90vw;box-shadow:0 8px 30px #0002}.report-title{border-bottom:2px solid var(--green);padding-bottom:16px;margin-bottom:20px}.report-area{margin:24px 0}.print-only{display:none}ul{padding-left:21px}.readiness{font-size:12px;color:var(--muted)}.inline-label{display:flex;align-items:center;gap:7px;font-weight:400}.inline-label input{width:auto}.tab-note{font-size:13px;max-width:850px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

<script>
'use strict';
const CURRICULUM={"title":"Growing Together · Early Learning Curriculum","edition":"1.0 original draft","ageScope":"Birth through age six; final pathway covers 5- and 6-year-olds (60–83 months).","approach":"Play-based, whole-child, responsive and inclusive, with intentional teaching and inquiry as useful.","popularityRankingVerified":false,"liveReferenceRetrievalSucceeded":false,"areas":[{"id":"relationships","title":"Relationships & regulation","goal":"Warm relationships, co-regulation, belonging, turn taking and solving social problems.","frameworkConnection":"Social and Emotional Development; Approaches to Learning"},{"id":"communication","title":"Communication & early literacy","goal":"Back-and-forth communication, home languages, stories, sound awareness, reading and purposeful writing.","frameworkConnection":"Language and Communication / Language and Literacy; Approaches to Learning"},{"id":"movement","title":"Movement & self-care","goal":"Safe movement, coordination, body awareness, participation in daily care and growing practical independence.","frameworkConnection":"Perceptual, Motor, and Physical Development"},{"id":"thinking","title":"Thinking & mathematics","goal":"Attention, memory, comparison, spatial thinking, number relationships and flexible problem solving.","frameworkConnection":"Cognition / Mathematics Development; Approaches to Learning"},{"id":"inquiry","title":"Science & inquiry","goal":"Close observation, questions, cause and effect, living things and testing ideas safely.","frameworkConnection":"Cognition / Scientific Reasoning; Approaches to Learning"},{"id":"expression","title":"Creative expression","goal":"Original choices through art, music, movement, construction and representation.","frameworkConnection":"Integrated expression across domains; Approaches to Learning"},{"id":"community","title":"Community & belonging","goal":"Family identity, home cultures, access, respectful relationships and care for shared places.","frameworkConnection":"Social and Emotional Development; Language and Communication"}],"ageBands":[{"id":"B01","title":"Young infants","label":"Birth–5 months","minMonths":0,"maxMonthsExclusive":6,"organization":"Individual, cue-based interactions during care and brief comfortable awake play.","teachingCycle":"Notice cues → respond warmly → pause for a response → adjust or stop.","priority":"Secure relationships and access to everyday experience; no academic drills or group-performance goals."},{"id":"B02","title":"Older infants","label":"6–11 months","minMonths":6,"maxMonthsExclusive":12,"organization":"Safe floor exploration with a nearby responsive adult; repeated familiar experiences.","teachingCycle":"Follow interest → offer a safe object/action → wait → acknowledge the child’s response.","priority":"Support emerging mobility and communication without forcing positions or milestones."},{"id":"B03","title":"Young toddlers","label":"12–23 months","minMonths":12,"maxMonthsExclusive":24,"organization":"Predictable routines, concrete materials, movement and short shared play.","teachingCycle":"Offer a choice → show one useful action → allow repetition → support a transition.","priority":"Use real objects and home-language words; emerging skills need adult support."},{"id":"B04","title":"Older toddlers","label":"24–35 months","minMonths":24,"maxMonthsExclusive":36,"organization":"Parallel play, pretend routines, simple problem solving and supported peer encounters.","teachingCycle":"Prepare two or more accessible choices → join briefly → model language → step back.","priority":"Participation and regulation vary widely; no forced sharing or required sitting."},{"id":"B05","title":"Preschool","label":"3 years · 36–47 months","minMonths":36,"maxMonthsExclusive":48,"organization":"Longer self-chosen center play with brief optional guided invitations and rich conversation.","teachingCycle":"Notice an idea → add a question or material → support a test or representation → revisit.","priority":"Build concepts through play, movement, stories and relationships; avoid worksheets as the core."},{"id":"B06","title":"Pre-K","label":"4 years · 48–59 months","minMonths":48,"maxMonthsExclusive":60,"organization":"Sustained play and projects with intentional small-group language, literacy and math.","teachingCycle":"Connect to experience → model a strategy → invite use → reflect with evidence.","priority":"Offer explicit teaching within meaningful work; do not make a birthday a readiness rule."},{"id":"B07","title":"Kindergarten bridge","label":"5- and 6-year-olds · 60–83 months","minMonths":60,"maxMonthsExclusive":84,"organization":"Play, purposeful projects and accessible explicit instruction, coordinated with the child’s school.","teachingCycle":"Choose a meaningful purpose → teach a needed tool → apply it → discuss and revise.","priority":"Includes children through age six. This author-designed bridge is not a verified state kindergarten curriculum."}],"lessons":[{"id":"C001","ageBand":"B01","area":"relationships","title":"Notice a cue, answer, and pause","stage":"Responsive interaction","materials":"Attentive familiar caregiver; quiet comfortable space","aim":"Build trust through a predictable response to an infant’s communication.","readiness":"Use the pathway as a starting point, not a test. Look for interest and comfortable access; offer a simpler or more complex version as needed.","steps":["Observe a small movement, sound, facial change or turning away.","Respond with a gentle voice or appropriate care, then pause.","Notice the next cue and adjust rather than continuing automatically."],"interest":"Build trust through a predictable response to an infant’s communication.","control":"The child’s actions, communication and the real result provide feedback. The adult checks safety and meaning, models as needed, and does not require a correct performance.","observe":"What cue occurred, the adult response and whether the infant settled, engaged or needed something else.","nextStep":"Repeat the response pattern during a familiar routine.","safety":"Follow the infant’s individual care plan and safe positioning. Never withhold feeding, comfort or needed care to create a learning trial.","adaptations":"Offer home-language words, signs, visual cues, stable positioning and adapted materials as useful. Participation can be watching, touching, moving, pointing or another comfortable response.","familyConnection":"Share one factual observation and ask what the family notices or enjoys at home. Suggest an optional everyday version using safe familiar materials; no purchase or homework is expected.","custom":false,"sourceStatus":"Original activity; reference-framework routes are listed separately and were not retrieved during this edition."},{"id":"C002","ageBand":"B01","area":"relationships","title":"A familiar calming sequence","stage":"Responsive interaction","materials":"Caregiver voice; usual approved comfort routine","aim":"Support co-regulation through a familiar, responsive care sequence.","readiness":"Use the pathway as a starting point, not a test. Look for interest and comfortable access; offer a simpler or more complex version as needed.","steps":["Approach calmly and tell the infant what you are doing.","Offer a familiar comfort action that fits the cue.","Pause and adjust; seek care-plan guidance if the infant remains distressed."],"interest":"Support co-regulation through a familiar, responsive care sequence.","control":"The child’s actions, communication and the real result provide feedback. The adult checks safety and meaning, models as needed, and does not require a correct performance.","observe":"Comfort cues and which adult action appeared helpful.","nextStep":"Share the observed comfort preference with the family.","safety":"Do not shake, restrain, swaddle for an activity or use weighted items. An activity does not explain persistent or unusual distress; follow health procedures.","adaptations":"Offer home-language words, signs, visual cues, stable positioning and adapted materials as useful. Participation can be watching, touching, moving, pointing or another comfortable response.","familyConnection":"Share one factual observation and ask what the family notices or enjoys at home. Suggest an optional everyday version using safe familiar materials; no purchase or homework is expected.","custom":false,"sourceStatus":"Original activity; reference-framework routes are listed separately and were not retrieved during this edition."},{"id":"C003","ageBand":"B01","area":"communication","title":"Face-to-face conversation","stage":"Responsive interaction","materials":"Caregiver at a comfortable distance and position","aim":"Experience a back-and-forth exchange without requiring speech or eye contact.","readiness":"Use the pathway as a starting point, not a test. Look for interest and comfortable access; offer a simpler or more complex version as needed.","steps":["Wait until the infant is awake and available.","Offer a short gentle sound or phrase and pause.","Respond to a movement, gaze shift, vocalization or other cue."],"interest":"Experience a back-and-forth exchange without requiring speech or eye contact.","control":"The child’s actions, communication and the real result provide feedback. The adult checks safety and meaning, models as needed, and does not require a correct performance.","observe":"The infant’s response form and the timing of the adult’s pause.","nextStep":"Repeat a familiar phrase in the home language.","safety":"Never require eye contact or continue when the infant turns away.","adaptations":"Offer home-language words, signs, visual cues, stable positioning and adapted materials as useful. Participation can be watching, touching, moving, pointing or another comfortable response.","familyConnection":"Share one factual observation and ask what the family notices or enjoys at home. Suggest an optional everyday version using safe familiar materials; no purchase or homework is expected.","custom":false,"sourceStatus":"Original activity; reference-framework routes are listed separately and were not retrieved during this edition."},{"id":"C004","ageBand":"B01","area":"communication","title":"A family lullaby during care","stage":"Responsive interaction","materials":"Family-approved song or spoken phrase","aim":"Connect a familiar voice pattern with warm interaction.","readiness":"Use the pathway as a starting point, not a test. Look for interest and comfortable access; offer a simpler or more complex version as needed.","steps":["Ask the family for a comfortable short song or phrase.","Use it softly during an appropriate awake care moment.","Pause and notice changes in movement, expression or vocalization."],"interest":"Connect a familiar voice pattern with warm interaction.","control":"The child’s actions, communication and the real result provide feedback. The adult checks safety and meaning, models as needed, and does not require a correct performance.","observe":"Comfort, attention and any signs that sound should stop.","nextStep":"Invite another familiar caregiver to use the same phrase.","safety":"Keep volume low; this is responsive interaction, not a sleep-training program or a required way to fall asleep.","adaptations":"Offer home-language words, signs, visual cues, stable positioning and adapted materials as useful. Participation can be watching, touching, moving, pointing or another comfortable response.","familyConnection":"Share one factual observation and ask what the family notices or enjoys at home. Suggest an optional everyday version using safe familiar materials; no purchase or homework is expected.","custom":false,"sourceStatus":"Original activity; reference-framework routes are listed separately and were not retrieved during this edition."},{"id":"C005","ageBand":"B01","area":"movement","title":"Comfortable awake tummy-time invitation","stage":"Responsive interaction","materials":"Firm clear floor mat; caregiver within reach","aim":"Offer an accessible opportunity for active movement while awake.","readiness":"Use the pathway as a starting point, not a test. Look for interest and comfortable access; offer a simpler or more complex version as needed.","steps":["Choose a brief comfortable awake moment and follow the care plan.","Offer a supervised tummy-time position suited to the infant.","Stay close, respond to cues and end or reposition when needed."],"interest":"Offer an accessible opportunity for active movement while awake.","control":"The child’s actions, communication and the real result provide feedback. The adult checks safety and meaning, models as needed, and does not require a correct performance.","observe":"Comfort, active movement and support actually provided.","nextStep":"Offer another brief opportunity when the infant is available.","safety":"Awake and directly supervised only. Never put an infant prone to sleep. Use a firm flat clear approved sleep surface on the back for every sleep; follow current program health guidance.","adaptations":"Offer home-language words, signs, visual cues, stable positioning and adapted materials as useful. Participation can be watching, touching, moving, pointing or another comfortable response.","familyConnection":"Share one factual observation and ask what the family notices or enjoys at home. Suggest an optional everyday version using safe familiar materials; no purchase or homework is expected.","custom":false,"sourceStatus":"Original activity; reference-framework routes are listed separately and were not retrieved during this edition."},{"id":"C006","ageBand":"B01","area":"movement","title":"Reach toward a familiar hand","stage":"Responsive interaction","materials":"Adult’s clean hand or a large safe infant object held by an adult","aim":"Explore voluntary reaching and midline movement.","readiness":"Use the pathway as a starting point, not a test. Look for interest and comfortable access; offer a simpler or more complex version as needed.","steps":["Position the infant safely with comfortable access.","Offer a hand or object where it can be noticed without strain.","Wait for any voluntary movement and adjust the distance."],"interest":"Explore voluntary reaching and midline movement.","control":"The child’s actions, communication and the real result provide feedback. The adult checks safety and meaning, models as needed, and does not require a correct performance.","observe":"Movement chosen by the infant, comfort and the amount of support.","nextStep":"Offer from a slightly different comfortable position.","safety":"Do not pull an infant by the arms, force grasping or use an object that can detach, choke or cover the face.","adaptations":"Offer home-language words, signs, visual cues, stable positioning and adapted materials as useful. Participation can be watching, touching, moving, pointing or another comfortable response.","familyConnection":"Share one factual observation and ask what the family notices or enjoys at home. Suggest an optional everyday version using safe familiar materials; no purchase or homework is expected.","custom":false,"sourceStatus":"Original activity; reference-framework routes are listed separately and were not retrieved during this edition."},{"id":"C007","ageBand":"B01","area":"thinking","title":"Following a slow nearby movement","stage":"Responsive interaction","materials":"Adult face or large simple high-contrast card","aim":"Notice a change and choose how to attend.","readiness":"Use the pathway as a starting point, not a test. Look for interest and comfortable access; offer a simpler or more complex version as needed.","steps":["Offer the face or card in comfortable light.","Move slowly over a small comfortable range.","Pause and follow the infant’s cue about whether to continue."],"interest":"Notice a change and choose how to attend.","control":"The child’s actions, communication and the real result provide feedback. The adult checks safety and meaning, models as needed, and does not require a correct performance.","observe":"Attention shifts, comfortable tracking and turning away.","nextStep":"Repeat with a familiar object after a rest.","safety":"No bright lights, flashing devices, laser pointers or objects suspended above a sleep space.","adaptations":"Offer home-language words, signs, visual cues, stable positioning and adapted materials as useful. Participation can be watching, touching, moving, pointing or another comfortable response.","familyConnection":"Share one factual observation and ask what the family notices or enjoys at home. Suggest an optional everyday version using safe familiar materials; no purchase or homework is expected.","custom":false,"sourceStatus":"Original activity; reference-framework routes are listed separately and were not retrieved during this edition."},{"id":"C008","ageBand":"B01","area":"thinking","title":"My response changes the exchange","stage":"Responsive interaction","materials":"Responsive caregiver; familiar short sound","aim":"Experience a simple social cause-and-effect pattern.","readiness":"Use the pathway as a starting point, not a test. Look for interest and comfortable access; offer a simpler or more complex version as needed.","steps":["Notice a voluntary sound or movement.","Answer with a brief consistent sound or expression.","Wait to see whether the infant continues or changes the exchange."],"interest":"Experience a simple social cause-and-effect pattern.","control":"The child’s actions, communication and the real result provide feedback. The adult checks safety and meaning, models as needed, and does not require a correct performance.","observe":"The sequence of infant action, adult response and next infant cue.","nextStep":"Repeat the pattern in a different comfortable care moment.","safety":"Adult selects intact, age-appropriate materials, checks access and supervises throughout. Stop or adapt when the child shows fatigue, distress or di function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDay(s){return new Date(s+'T12:00:00')}
function dayAdd(s,n){const d=parseDay(s);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function weekStart(s){const d=parseDay(s);return dayAdd(s,-((d.getDay()+6)%7))}
function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(parseDay(s).getTime())&&dayAdd(s,0)===s}
function dateLabel(s,opts={month:'short',day:'numeric',year:'numeric'}){return validDate(s)?parseDay(s).toLocaleDateString(undefined,opts):'—'}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function age(dob){if(!validDate(dob))return 'Age not recorded';let months=(parseDay(today()).getFullYear()-parseDay(dob).getFullYear())*12+parseDay(today()).getMonth()-parseDay(dob).getMonth();if(parseDay(today()).getDate()<parseDay(dob).getDate())months--;return `${Math.floor(months/12)}y ${months%12}m`}

function assert(ok,msg){if(!ok)throw Error(msg)}
function validate(data){
 assert(data&&data.applicationId==='growing-together-childcare-0-6'&&data.schemaVersion===SCHEMA,'This backup is not from the Early Learning 0–6 system, or uses an unsupported version. Montessori backups belong in the Montessori system.');
 for(const key of ['children','plans','observations','customLessons'])assert(Array.isArray(data[key])&&data[key].length<=20000,'Invalid or oversized '+key+'.');
 const ids={};for(const key of ['children','plans','observations','customLessons']){ids[key]=new Set();for(const row of data[key]){assert(row&&typeof row.id==='string'&&/^[A-Za-z0-9_-]{1,100}$/.test(row.id)&&!ids[key].has(row.id),'Invalid or duplicate record ID.');ids[key].add(row.id);for(const [k,v] of Object.entries(row)){if(typeof v==='string')assert(v.length<=15000,'A text field is too long.');}}}
 const text=(r,keys)=>keys.every(k=>typeof r[k]==='string');
 for(const c of data.children){assert(['familyPriority','routinePreferences'].every(k=>c[k]===undefined||typeof c[k]==='string'),'Invalid family/profile text.');assert(text(c,['name','dob','start','language','strengths','interests','supports','teacher'])&&c.name.trim().length>0&&c.name.length<=100&&validDate(c.dob)&&c.dob<=today()&&validDate(c.start)&&typeof c.archived==='boolean','Invalid child record.');}
 for(const l of data.customLessons){assert(BANDS.some(b=>b.id===l.ageBand),'Choose a valid age pathway for each custom activity.');assert(!BASE.some(b=>b.id===l.id)&&text(l,['title','area','stage','aim','materials','readiness','interest','control','observe','nextStep','safety'])&&l.title.trim()&&AREAS.some(a=>a.id===l.area)&&STAGES.includes(l.stage)&&Array.isArray(l.steps)&&l.steps.length>0&&l.steps.length<=30&&l.steps.every(x=>typeof x==='string'&&x.length<=3000),'Invalid custom lesson.');}
 const lessonIds=new Set([...BASE.map(l=>l.id),...ids.customLessons]);
 for(const p of data.plans)assert(Array.isArray(p.childIds)&&p.childIds.length>0&&new Set(p.childIds).size===p.childIds.length&&p.childIds.every(id=>ids.children.has(id))&&lessonIds.has(p.lessonId)&&validDate(p.date)&&text(p,['workCycle','focus','materials','notes'])&&['planned','ready','presented','deferred'].includes(p.status),'Invalid lesson plan or missing linked record.');
 for(const o of data.observations)assert(ids.children.has(o.childId)&&lessonIds.has(o.lessonId)&&validDate(o.date)&&o.date<=today()&&Object.hasOwn(STATUSES,o.status)&&text(o,['context','objective','engagement','independence','nextStep','teacher','createdAt'])&&o.objective.trim()&&/^\d{4}-\d{2}-\d{2}T/.test(o.createdAt)&&!Number.isNaN(Date.parse(o.createdAt)),'Invalid observation or missing linked record.');
 return {applicationId:'growing-together-childcare-0-6',schemaVersion:SCHEMA,children:data.children,plans:data.plans,observations:data.observations,customLessons:data.customLessons};
}

function btn(action,label,extra='',primary=false){return `<button type="button" data-action="${action}" ${extra} class="${primary?'primary':''}">${esc(label)}</button>`}
function go(view){activeView=view;render();window.scrollTo(0,0)}
function render(){document.querySelector('#nav').innerHTML=Object.entries(VIEWS).map(([v,t])=>`<button data-view="${v}" class="${v===activeView?'active':''}" ${v===activeView?'aria-current="page"':''}>${t}</button>`).join('');document.querySelector('#saveBadge').textContent=memoryOnly?'Temporary session — export to keep':'Saved on this device';document.querySelector('#storageWarning').innerHTML=storageProblem?`<div class="notice error">${esc(storageProblem)}</div>`:'';document.querySelector('#app').innerHTML=({dashboard:dashboard,children:childrenView,curriculum:curriculumView,pathways:pathwaysView,yearmap:yearMapView,planner:plannerView,observations:observationsView,progress:progressView,reports:reportsView,guide:guideView}[activeView])();}
function dashboard(){const kids=activeChildren(), recent=state.observations.filter(o=>o.date>=dayAdd(today(),-6)&&o.date<=today()&&!child(o.childId)?.archived);const pending=state.plans.filter(p=>p.date>=today()&&p.date<=dayAdd(today(),6)&&p.status!=='presented'&&p.status!=='deferred');const follow=kids.flatMap(c=>lessons().map(l=>latest(c.id,l.id))).filter(o=>o?.status==='revisit');return head('Room to grow','A clear view of what you have planned, what you have noticed, and what to offer next.',btn('child-new','Add a child','',true)+btn('observation-new','Record an observation'))+`<div class="stats"><div class="stat"><strong>${kids.length}</strong><span>Active children</span></div><div class="stat"><strong>${pending.length}</strong><span>Plans · next 7 days</span></div><div class="stat"><strong>${recent.length}</strong><span>Observations · last 7 days</span></div><div class="stat"><strong>${follow.length}</strong><span>Latest records suggesting a revisit</span></div></div>`+(!kids.length?empty('Start with a child profile. The lesson library is ready to explore.',btn('child-new','Add your first child','',true)+btn('demo','Try fictional sample records')):'')+`<div class="grid"><section class="panel"><h2>Next invitations</h2>${pending.length?pending.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(p=>`<div class="record"><div class="kicker">${dateLabel(p.date)}</div><h3>${esc(lesson(p.lessonId)?.title)}</h3><p>${esc(p.childIds.map(id=>child(id)?.name).join(', '))}</p><p>${esc(p.focus||'Follow the child’s current readiness and interest.')}</p>${btn('plan-edit','Open plan',`data-id="${p.id}"`)}</div>`).join(''):'<p class="muted">No upcoming invitations yet. Keep plans flexible and protect time for self-chosen work.</p>'}${btn('go-planner','Open weekly plan')}</section><section class="panel"><h2>Observe → offer → revisit</h2><ol><li>Watch before intervening. Write what the child actually did or said.</li><li>Choose a purposeful next invitation based on that evidence.</li><li>Present briefly, then allow repetition and choice.</li><li>Record the support needed and return to observe on another day.</li></ol><div class="notice">An independent performance is one dated observation. It is not a permanent mastery label or an age-based score.</div>${btn('go-guide','Read the teaching guide')}</section></div><section class="panel"><h2>Seven connected areas</h2><div class="grid">${AREAS.map(a=>`<div><div class="kicker">${esc(a.title)}</div><p class="small muted">${esc(a.goal)}</p></div>`).join('')}</div></section>`}
function childrenView(){const list=state.children.filter(c=>showArchived||!c.archived);return head('Children','Keep a useful profile of each child’s strengths, interests, language and support needs.',btn('child-new','Add a child','',true))+`<div class="toolbar no-print"><label class="inline-label"><input type="checkbox" id="archivedToggle" ${showArchived?'checked':''}> Show archived children</label></div>`+(list.length?`<div class="grid">${list.map(c=>`<article class="card"><div class="flex"><h2>${esc(c.name)}</h2>${c.archived?'<span class="pill">Archived</span>':''}</div><p class="muted">${esc(age(c.dob))} · Joined ${dateLabel(c.start)}</p><p><strong>Interests</strong><br><span class="flow-text">${esc(c.interests||'Not recorded yet')}</span></p><p><strong>Strengths</strong><br><span class="flow-text">${esc(c.strengths||'Not recorded yet')}</span></p><p class="small muted">${state.observations.filter(o=>o.childId===c.id).length} observations · ${state.plans.filter(p=>p.childIds.includes(c.id)).length} plans</p><div class="actions">${btn('child-edit','Edit profile',`data-id="${c.id}"`)}${btn('child-progress','Progress',`data-id="${c.id}"`)}${btn('child-archive',c.archived?'Restore child':'Archive',`data-id="${c.id}"`)}</div></article>`).join('')}</div>`:empty('No active child profiles yet.',btn('child-new','Add a child','',true)))}
function field(label,name,value='',type='text',attrs=''){return `<label>${esc(label)}<input name="${name}" type="${type}" value="${esc(value)}" ${attrs}></label>`}
function textField(label,name,value='',attrs=''){return `<label ${attrs}>${esc(label)}<textarea name="${name}" maxlength="5000">${esc(value)}</textarea></label>`}
function formFoot(label='Save'){return `<div class="dialog-foot">${btn('close','Cancel')}<button class="primary" type="submit">${esc(label)}</button></div>`}
function childForm(id){const c=child(id)||{name:'',dob:'',start:today(),language:'',strengths:'',interests:'',supports:'',teacher:''};dialog(id?'Edit child profile':'Add a child',`<form id="childForm" data-id="${esc(id||'')}"><div class="form-grid">${field('Child name or preferred identifier *','name',c.name,'text','required maxlength="100" autocomplete="off"')}${field('Date of birth *','dob',c.dob,'date',`required max="${today()}"`)}${field('Enrollment date *','start',c.start,'date','required')}${field('Guide / key teacher','teacher',c.teacher,'text','maxlength="120"')}${field('Home language(s) and communication','language',c.language,'text','maxlength="500"')}${textField('Strengths and what brings confidence','strengths',c.strengths)}${textField('Current interests','interests',c.interests)}${textField('Access needs and useful teaching supports','supports',c.supports)}</div><p class="small muted">Use only information needed for teaching. Keep medical, safeguarding and formal support records in the program’s approved system.</p>${formFoot()}</form>`)}
function curriculumView(){let list=lessons().filter(l=>(!areaFilter||l.area===areaFilter)&&(!ageFilter||l.ageBand===ageFilter)&&(!stageFilter||l.stage===stageFilter)&&(!search||[l.title,l.materials,l.aim,l.observe].join(' ').toLowerCase().includes(search.toLowerCase())));return head('Activity library','98 original invitations across seven pathways and seven learning areas. Choose by actual cues, interests and access, not a required birthday checklist.',btn('lesson-new','Add a custom activity','',true))+`<div class="toolbar no-print"><label>Find an activity<input id="lessonSearch" type="search" placeholder="Search an idea or material…" value="${esc(search)}"></label><label>Pathway<select id="ageFilter"><option value="">All ages</option>${options(BANDS.map(b=>[b.id,b.title+' · '+b.label]),ageFilter)}</select></label><label>Learning area<select id="areaFilter"><option value="">All areas</option>${options(AREAS.map(a=>[a.id,a.title]),areaFilter)}</select></label><label>Interaction style<select id="stageFilter"><option value="">All styles</option>${options(STAGES.map(x=>[x,x]),stageFilter)}</select></label></div><p class="small muted">${list.length} activities shown. Home language, communication access and family knowledge belong in every pathway.</p><div class="grid">${list.map(l=>`<article class="card"><div class="kicker">${esc(areaName(l.area))}</div><h3>${esc(l.title)}</h3><span class="pill">${esc(bandName(l.ageBand))}</span><p>${esc(l.aim)}</p><p class="small muted"><strong>Notice:</strong> ${esc(l.observe)}</p><div class="actions">${btn('lesson-view','Activity details',`data-id="${l.id}"`)}${btn('plan-from-lesson','Plan',`data-id="${l.id}"`)}</div></article>`).join('')}</div>`+(list.length?'':empty('No matching activities. Try another pathway or search.'))}
function lessonDetail(id){const l=lesson(id);if(!l)return;dialog(l.title,`<div class="lesson-detail"><p><span class="pill">${esc(areaName(l.area))}</span> <span class="pill">${esc(l.stage)}</span></p><dl><dt>Direct aim</dt><dd>${esc(l.aim)}</dd><dt>Starting point / access</dt><dd>${esc(l.readiness)}</dd><dt>Materials</dt><dd>${esc(l.materials)}</dd></dl><h3>Presentation outline</h3><p class="small muted">Invite, name the work and prepare the space. Show the movements slowly with minimal unnecessary speech. Pause for the child to choose whether to continue; demonstrate restoring the work when needed.</p><ol>${l.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><dl><dt>Point of interest</dt><dd>${esc(l.interest)}</dd><dt>Feedback and adult support</dt><dd>${esc(l.control)}</dd><dt>What to observe</dt><dd>${esc(l.observe)}</dd><dt>Possible next invitation</dt><dd>${esc(l.nextStep)}</dd><dt>Safety & access</dt><dd>${esc(l.safety)}</dd></dl><div class="notice">An original learning invitation, not a developmental test. Adapt to actual cues, access, language and care needs. An infant does not need to perform an academic task. Safety and required care take priority.</div><div class="actions">${btn('plan-from-lesson','Plan this lesson',`data-id="${id}"`,true)}${btn('observe-from-lesson','Record an observation',`data-id="${id}"`)}${l.custom?btn('lesson-edit','Edit custom lesson',`data-id="${id}"`):''}</div></div>`)}
function lessonForm(id){const l=state.customLessons.find(l=>l.id===id)||{title:'',area:'practical',stage:'Exploring',aim:'',materials:'',readiness:'',steps:[''],interest:'',control:'',observe:'',nextStep:'',safety:''};dialog(id?'Edit custom lesson':'Add a custom lesson',`<form id="lessonForm" data-id="${esc(id||'')}"><div class="form-grid">${field('Lesson title *','title',l.title,'text','required maxlength="200"')}<label>Area<select name="area">${options(AREAS.map(a=>[a.id,a.title]),l.area)}</select></label><label>Sequence<select name="stage">${options(STAGES.map(x=>[x,x]),l.stage)}</select></label>${textField('Direct aim *','aim',l.aim)}${textField('Materials *','materials',l.materials)}${textField('Readiness and prior experience *','readiness',l.readiness)}${textField('Presentation steps · one per line *','steps',l.steps.join('\n'))}${textField('Point of interest','interest',l.interest)}${textField('Feedback and adult support','control',l.control)}${textField('What to observe *','observe',l.observe)}${textField('Possible next invitation','nextStep',l.nextStep)}${textField('Safety and access considerations','safety',l.safety)}</div>${formFoot()}</form>`);for(const name of ['aim','materials','readiness','steps','observe'])document.querySelector(`#lessonForm [name=${name}]`).required=true;}
function plannerView(){const days=Array.from({length:7},(_,i)=>dayAdd(week,i));return head('Weekly plan','Plan a few thoughtful invitations. Leave room for repetition, spontaneous interests and uninterrupted self-chosen work.',btn('plan-new','Plan an invitation','',true)+btn('print','Print this week'))+`<div class="toolbar no-print">${btn('previous-week','← Previous')}<label>Week containing<input type="date" id="weekDate" value="${week}"></label>${btn('next-week','Next →')}${btn('this-week','This week')}<label>Child<select id="plannerChild"><option value="">All active children</option>${childOptions(selectedChild,true)}</select></label></div><div class="print-only"><h1>Weekly early learning plan</h1><p>${dateLabel(week)} – ${dateLabel(dayAdd(week,6))}</p></div><section class="panel">${days.map(date=>{const ps=state.plans.filter(p=>p.date===date&&(!selectedChild?p.childIds.some(id=>!child(id)?.archived):p.childIds.includes(selectedChild))).sort((a,b)=>a.workCycle.localeCompare(b.workCycle));return `<div class="day"><div><h3>${dateLabel(date,{weekday:'long'})}</h3><span class="small muted">${dateLabel(date,{month:'short',day:'numeric'})}</span></div><div>${ps.length?ps.map(p=>`<article class="plan ${p.status}"><div class="flex"><h3>${esc(lesson(p.lessonId)?.title)}</h3><span class="pill">${esc(p.status)}</span></div><p><strong>${esc(p.childIds.map(id=>child(id)?.name).join(', '))}</strong> · ${esc(p.workCycle)}</p><p class="flow-text">${esc(p.focus||'Observe readiness before offering the lesson.')}</p>${p.materials?`<p class="small"><strong>Prepare:</strong> ${esc(p.materials)}</p>`:''}${p.notes?`<p class="small flow-text">${esc(p.notes)}</p>`:''}<div class="actions no-print">${btn('plan-edit','Edit',`data-id="${p.id}"`)}${btn('lesson-view','Presentation',`data-id="${p.lessonId}"`)}${btn('plan-observe','Record outcome',`data-id="${p.id}"`)}</div></article>`).join(''):'<p class="muted small">Open space for child-chosen work and observation.</p>'}</div></div>`}).join('')}</section><p class="tab-note muted">Marking a plan “presented” does not create a progress record. Use “Record outcome” for a dated observation of each child; a group plan needs individual evidence for each participant.</p>`}
function planForm(id,lessonId,childId){if(!activeChildren().length&&!id){toast('Add a child profile before planning a lesson.');closeDialog();go('children');return}const p=state.plans.find(p=>p.id===id)||{lessonId:lessonId||lessons()[0].id,childIds:childId?[childId]:selectedChild?[selectedChild]:[],date:weekStart(today())===week?today():week,workCycle:'Morning play / exploration',focus:'',materials:lesson(lessonId||lessons()[0].id)?.materials||'',notes:'',status:'planned'};const kids=state.children.filter(c=>!c.archived||p.childIds.includes(c.id));dialog(id?'Edit invitation plan':'Plan an invitation',`<form id="planForm" data-id="${esc(id||'')}"><div class="form-grid"><label class="full">Activity / experience *<select name="lessonId" required>${options(lessons().map(l=>[l.id,bandName(l.ageBand)+' · '+areaName(l.area)+' · '+l.title]),p.lessonId)}</select></label><fieldset class="full"><legend>Child / small group *</legend><div class="checks">${kids.map(c=>`<label><input type="checkbox" name="childIds" value="${c.id}" ${p.childIds.includes(c.id)?'checked':''}>${esc(c.name)}${c.archived?' (archived)':''}</label>`).join('')}</div></fieldset>${field('Date *','date',p.date,'date','required')}<label>Work period<select name="workCycle">${options(['Morning play / exploration','Afternoon play / exploration','Outdoor / community','Flexible invitation'].map(x=>[x,x]),p.workCycle)}</select></label><label>Status<select name="status">${options(['planned','ready','presented','deferred'].map(x=>[x,x]),p.status)}</select></label>${textField('Why this invitation? Link it to an observation.','focus',p.focus)}${textField('Materials / preparation','materials',p.materials)}${textField('Adaptations, group arrangement and notes','notes',p.notes)}</div>${formFoot()}${id?btn('plan-delete','Delete plan',`data-id="${id}"`):''}</form>`)}
function observationsView(){const list=state.observations.filter(o=>(!selectedChild||o.childId===selectedChild)&&(!observationFilter||o.status===observationFilter)).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));return head('Observations','Record what happened, the support given and the next useful invitation. Keep interpretation separate from evidence.',btn('observation-new','Record observation','',true))+`<div class="toolbar no-print"><label>Child<select id="observationChild"><option value="">All children</option>${childOptions(selectedChild,true)}</select></label><label>Record status<select id="observationStatus"><option value="">All statuses</option>${options(Object.entries(STATUSES),observationFilter)}</select></label></div><section class="panel">${list.length?list.map(o=>recordMarkup(o,true)).join(''):empty('No observations match this view. A brief factual note is a useful place to start.')}</section>`}
function recordMarkup(o,edit=false){return `<article class="record"><div class="flex"><div><span class="small muted">${dateLabel(o.date)} · ${esc(child(o.childId)?.name)}</span><h3>${esc(lesson(o.lessonId)?.title)}</h3></div>${badge(o.status)}</div><p class="flow-text"><strong>Observed:</strong> ${esc(o.objective)}</p>${o.context?`<p class="flow-text"><strong>Context:</strong> ${esc(o.context)}</p>`:''}${o.independence?`<p class="flow-text"><strong>Support:</strong> ${esc(o.independence)}</p>`:''}${o.engagement?`<p class="flow-text"><strong>Engagement:</strong> ${esc(o.engagement)}</p>`:''}${o.nextStep?`<p class="flow-text"><strong>Next invitation:</strong> ${esc(o.nextStep)}</p>`:''}${o.teacher?`<p class="small muted">Recorded by ${esc(o.teacher)}</p>`:''}${edit?`<div class="actions no-print">${btn('observation-edit','Edit record',`data-id="${o.id}"`)}${btn('plan-from-observation','Plan next invitation',`data-id="${o.id}"`)}</div>`:''}</article>`}
function observationForm(id,lessonId,childId,planId){if(!state.children.length){toast('Add a child profile before recording an observation.');closeDialog();go('children');return}const plan=state.plans.find(p=>p.id===planId);const o=state.observations.find(o=>o.id===id)||{childId:childId||selectedChild||plan?.childIds[0]||activeChildren()[0]?.id||state.children[0].id,lessonId:lessonId||plan?.lessonId||lessons()[0].id,date:plan&&plan.date<=today()?plan.date:today(),status:'presented',context:plan?.focus||'',objective:'',engagement:'',independence:'',nextStep:'',teacher:''};dialog(id?'Edit observation':'Record an observation',`<form id="observationForm" data-id="${esc(id||'')}" data-plan="${esc(planId||'')}"><div class="form-grid"><label>Child *<select name="childId" required>${childOptions(o.childId,true)}</select></label>${field('Observation date *','date',o.date,'date',`required max="${today()}"`)}<label class="full">Activity / experience *<select name="lessonId">${options(lessons().map(l=>[l.id,bandName(l.ageBand)+' · '+areaName(l.area)+' · '+l.title]),o.lessonId)}</select></label><label>Observed status<select name="status">${options(Object.entries(STATUSES),o.status)}</select></label>${field('Recorded by','teacher',o.teacher||child(o.childId)?.teacher||'','text','maxlength="120"')}${textField('Context / invitation','context',o.context)}<label>What did you see or hear? *<textarea name="objective" required maxlength="5000" placeholder="Example: Poured water twice. On the second attempt, stopped before the cup filled and wiped one spill without a reminder.">${esc(o.objective)}</textarea></label>${textField('Support actually needed','independence',o.independence)}${textField('Engagement and child’s response','engagement',o.engagement)}${textField('Possible next invitation / follow-up','nextStep',o.nextStep)}</div><p class="small muted">Record the child’s actual engagement and adult support. Responsive help and co-regulation are expected, especially for infants. An independently used strategy describes one event, not permanent mastery. Declining an invitation is not failure.</p>${plan?'<div class="notice">This records one child’s outcome. Update the group plan status separately, and record other participants individually.</div>':''}${formFoot('Save observation')}${id?btn('observation-delete','Delete record',`data-id="${id}"`):''}</form>`)}
function ensureSelected(){if(!child(selectedChild))selectedChild=activeChildren()[0]?.id||state.children[0]?.id||'';return child(selectedChild)}
function progressView(){const c=ensureSelected();let ls=lessons();if(c){if(progressBand==='observed')ls=ls.filter(l=>state.observations.some(o=>o.childId===c.id&&o.lessonId===l.id));else{const target=progressBand==='current'?childBand(c.id)?.id:progressBand==='all'?'':progressBand;if(target)ls=ls.filter(l=>l.ageBand===target);}}if(progressAreaFilter)ls=ls.filter(l=>l.area===progressAreaFilter);return head('Progress record','Dated evidence of real experiences, not a checklist of age requirements. The default view shows activities with observations.',btn('print','Print record'))+`<div class="toolbar no-print"><label>Child<select id="progressChild">${childOptions(selectedChild,true)}</select></label><label>Activity scope<select id="progressBand">${options([['observed','Recorded activities only'],['current','Current age pathway'],['all','All reference activities'],...BANDS.map(b=>[b.id,b.title+' · '+b.label])],progressBand)}</select></label><label>Learning area<select id="progressArea"><option value="">All areas</option>${options(AREAS.map(a=>[a.id,a.title]),progressAreaFilter)}</select></label></div>`+(!c?empty('Add a child to begin an individual observation record.'):`<div class="print-only"><h1>Early learning observation record</h1><p>${esc(c.name)} · As of ${dateLabel(today())}</p></div><section class="panel"><h2>${esc(c.name)}</h2><p class="muted">${esc(age(c.dob))} · ${esc(c.language||'Home language not recorded')}</p><p class="small">${esc(childBand(c.id)?bandName(childBand(c.id).id):'Outside the published age pathways')} is a suggested organizing range, not a requirement. Earlier and later recorded experiences remain in the history.</p><p class="small muted">${state.observations.filter(o=>o.childId===c.id).length} observations recorded. Responsive adult support and co-regulation are expected, especially for infants. “Not recorded” says nothing about ability; an independent event is not permanent mastery.</p></section><section class="panel table-scroll">${ls.length?`<table><thead><tr><th>Activity / pathway</th><th>Latest observation status</th><th>Date</th><th>Support / next invitation</th><th class="no-print">Action</th></tr></thead><tbody>${ls.map(l=>{const o=latest(c.id,l.id);return `<tr><td><strong>${esc(l.title)}</strong><br><span class="small muted">${esc(areaName(l.area))}<br>${esc(bandName(l.ageBand))}</span></td><td>${badge(o?.status)}</td><td>${o?dateLabel(o.date):'—'}</td><td class="flow-text">${esc(o?.independence||'')}${o?.nextStep?'\nNext: '+esc(o.nextStep):''}</td><td class="no-print">${btn('observe-specific','Add note',`data-child="${c.id}" data-id="${l.id}"`)}</td></tr>`}).join('')}</tbody></table>`:empty('No observations match this view yet. Choose a pathway to browse reference activities, or record a real experience first.')}</section>`)}
function reportsView(){const c=ensureSelected();const valid=validDate(reportFrom)&&validDate(reportTo)&&reportFrom<=reportTo&&reportTo<=today();const obs=c&&valid?state.observations.filter(o=>o.childId===c.id&&o.date>=reportFrom&&o.date<=reportTo).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt.localeCompare(b.createdAt)):[];return head('Individual learning report','Review this staff record before sharing. Choose a date range, print to paper or PDF, or export the observations as CSV.',btn('print','Print / save PDF')+btn('csv','Export observations CSV'))+`<div class="toolbar no-print"><label>Child<select id="reportChild">${childOptions(selectedChild,true)}</select></label><label>From<input id="reportFrom" type="date" value="${esc(reportFrom)}" max="${today()}"></label><label>Through<input id="reportTo" type="date" value="${esc(reportTo)}" max="${today()}"></label></div>`+(!c?empty('Add a child and observations to create a report.'):!valid?'<div class="notice error">Choose a valid date range ending on or before today.</div>':`<section class="panel report-sheet"><div class="report-title"><div class="kicker">Growing Together · Early Learning 0–6</div><h1>${esc(c.name)}</h1><p>${dateLabel(reportFrom)} – ${dateLabel(reportTo)} · ${obs.length} recorded observations</p></div><h3>Current profile</h3><p class="small muted">Profile fields reflect the current profile, not a historical snapshot of the selected period.</p><p class="flow-text"><strong>Strengths:</strong> ${esc(c.strengths||'Not recorded')}</p><p class="flow-text"><strong>Interests:</strong> ${esc(c.interests||'Not recorded')}</p><p class="flow-text"><strong>Language / communication:</strong> ${esc(c.language||'Not recorded')}</p><div class="notice no-print">Staff working report: check names, quotes and sensitive context before sharing. Teaching support notes from the profile are omitted; observation text is included as entered.</div>${AREAS.map(a=>{const rows=obs.filter(o=>lesson(o.lessonId)?.area===a.id);return `<section class="report-area"><h2>${esc(a.title)}</h2>${rows.length?rows.map(o=>recordMarkup(o)).join(''):'<p class="small muted">No observations recorded in this period. This does not establish that the child did no work in this area.</p>'}</section>`}).join('')}<p class="small muted">Statuses describe individual dated observations. This record does not provide a standardized assessment, diagnosis, guaranteed readiness for school or a permanent mastery judgment.</p></section>`)}
function guideView(){return head('Teaching guide & backups','A play-based, whole-child curriculum with responsive care, intentional teaching and room for the child’s own ideas.')+`<section class="panel"><h2>Keep a restorable copy</h2><p>Records stay in this browser on this device. This version has no login, shared access, cloud synchronization, encryption provided by the tool or automatic backup. Export a full JSON backup regularly, especially before moving files or clearing browser data.</p><div class="actions">${btn('backup','Export full backup','',true)}${btn('import','Restore a backup')}${btn('csv-all','Export all observations CSV')}${btn('demo','Add fictional sample records')}</div><p class="small muted">Restore replaces the dataset after confirmation and requests a backup download of the current records first. Check your downloads. CSV is for spreadsheets and cannot restore the system. Montessori and Early Learning backups are separate formats; they are not merged.</p></section><section class="panel"><h2>Why this approach</h2><p>The Creative Curriculum, HighScope and Frog Street are recognizable U.S. curriculum families. They are not interchangeable and a current national popularity ranking was not verified. This original curriculum uses a broad play-based, whole-child structure instead of copying a commercial program.</p><p>Infants learn through warm responsive care and safe exploration. Toddlers need familiar routines, movement and concrete play. Preschool and kindergarten-age children benefit from sustained play, inquiry and appropriate explicit teaching. A child’s age pathway is a starting point, not a test or deadline.</p><div class="notice">Live search and all ten reference requests were blocked by the environment’s proxy. NAEYC, Head Start ELOF, publisher and health-reference routes are documented in the package, but were not retrieved or verified for this edition. No source endorsement, market-share ranking or completed standards alignment is claimed.</div></section><section class="panel"><h2>The teaching cycle</h2><ol><li><strong>Connect and observe.</strong> Hear family priorities, notice cues, and make the space accessible.</li><li><strong>Choose a purpose.</strong> Select a few invitations based on real interests and prior observations.</li><li><strong>Join with intention.</strong> Respond, model, describe or ask a useful question without taking over.</li><li><strong>Allow repetition and choice.</strong> Protect play and responsive care. Stop or adapt when the child needs something else.</li><li><strong>Record and revisit.</strong> Write an actual action, word, support and response. Decide what opportunity might help next.</li></ol></section><section class="panel"><h2>What to record</h2><p>Use factual language: “Matched one cup to each person, then counted the five cups after one reminder.” Avoid “Mastered math.” Record communication in any form, support, engagement, repeated choices and the child’s own meaning.</p><p>Interest, an offered invitation, practice, a strategy used independently in one event, and a plan to adjust are observation descriptions. They are not developmental scores. Independent performance is not an infant goal, and co-regulation or adapted tools are not failures. Counts describe recorded experiences, not achievement.</p><p>Reports use selected dates for observations but current profile fields for strengths/interests. Review sensitive information before sharing. An absent record does not mean absent learning.</p></section><section class="panel"><h2>Daily experience</h2><p>Keep feeding, sleeping, toileting and comfort responsive to the actual child and approved health procedures. Infants are not placed on a group learning timetable. Offer brief awake interactions and safe floor exploration without forced positions.</p><p>For toddlers and older children, alternate sustained self-chosen play, outdoor movement, care, meals, rest/quiet options and short useful small-group invitations. The 48-week map offers connections to explore; it does not require babies or families to perform weekly themes.</p></section><section class="panel"><h2>Safety, inclusion and families</h2><p>Check choking/mouthing risks, tools, allergies, sensory access, movement, water and outdoor conditions before each invitation. Keep older children’s small parts inaccessible to younger children. Safe sleep, required care and safeguarding always take priority; curriculum notes do not replace approved health records.</p><p>Use home languages, signs, augmentative communication, adapted positioning and culturally accurate materials. Do not force eye contact, touch, speech, tasting, public performance or family disclosure. Toileting, mobility, communication and disability-related support are not admission/readiness tests.</p><p>Share strengths and specific observations with families, ask what happens at home, and coordinate useful supports. Developmental concerns follow the program’s approved family/referral process; this curriculum does not diagnose or replace screening.</p></section><section class="panel"><h2>Scope and reference routes</h2><p>The documented Head Start ELOF connection is an illustrative organizing map for birth to five, not a verified code-by-code alignment or a mandate for all centers. The 5- and 6-year-old bridge is original and needs coordination with the receiving school and applicable state standards.</p><p>Professional review routes: <a href="https://www.naeyc.org/resources/position-statements/dap/contents" target="_blank" rel="noopener noreferrer">NAEYC DAP</a>, <a href="https://headstart.gov/school-readiness/article/head-start-early-learning-outcomes-framework" target="_blank" rel="noopener noreferrer">Head Start ELOF</a>, <a href="https://headstart.gov/curriculum" target="_blank" rel="noopener noreferrer">Head Start curriculum reviews</a>. These pages could not be retrieved during authoring; see the research log.</p><p>This tool is not an approved commercial curriculum, official exam, licensing compliance system or standardized developmental assessment. Staff training, local health rules, individualized plans and qualified professional review remain necessary.</p></section>`}
function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function backup(prefix='Early_Learning_Backup'){download(`${prefix}_${today()}.json`,JSON.stringify({...state,exportedAt:new Date().toISOString(),curriculumEdition:'early-learning-98-v1'},null,2),'application/json');toast('Backup download requested. Check your Downloads folder.');}
function csvCell(s){let t=String(s??'');if(/^[\s]*[=+\-@]/.test(t)||/^[\t\r\n]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'}
function exportCsv(all=false){if(!all&&(!selectedChild||!validDate(reportFrom)||!validDate(reportTo)||reportFrom>reportTo||reportTo>today())){toast('Choose a child and a valid report date range first.');return}const rows=state.observations.filter(o=>all||(o.childId===selectedChild&&o.date>=reportFrom&&o.date<=reportTo));const fields=['Child','Date','Area','Lesson','Observed status','Context','Objective observation','Support','Engagement','Next invitation','Recorded by','Age pathway'];const data=rows.map(o=>[child(o.childId)?.name,o.date,areaName(lesson(o.lessonId)?.area),lesson(o.lessonId)?.title,STATUSES[o.status],o.context,o.objective,o.independence,o.engagement,o.nextStep,o.teacher,bandName(lesson(o.lessonId)?.ageBand)]);download(`Early_Learning_Observations_${today()}.csv`,'\uFEFF'+[fields,...data].map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV download requested.');}
function loadDemo(){if(!confirm('Add clearly fictional sample profiles, one plan and two observations? Your existing records will be kept.'))return;const a=uid(),b=uid();if(commit(s=>{s.children.push({id:a,name:'SAMPLE · Alex',dob:dayAdd(today(),-1460),start:dayAdd(today(),-60),language:'English and a home language',strengths:'Enjoys comparing and helping.',interests:'Blocks, quantities and stories.',supports:'Allow processing time and real materials.',teacher:'Sample educator',archived:false},{id:b,name:'SAMPLE · Casey',dob:dayAdd(today(),-2190),start:dayAdd(today(),-100),language:'English',strengths:'Explains a construction idea.',interests:'Making useful structures.',supports:'Offer a visual sequence when useful.',teacher:'Sample educator',archived:false});s.observations.push({id:uid(),childId:a,lessonId:'C077',date:dayAdd(today(),-1),status:'practicing',context:'Compared two useful collections.',objective:'Matched four objects with four in the other group, then noticed one extra in the second group.',engagement:'Asked to compare again.',independence:'Adult modeled one match first.',nextStep:'Offer another manageable comparison with real materials.',teacher:'Sample educator',createdAt:new Date().toISOString()},{id:uid(),childId:b,lessonId:'C091',date:today(),status:'presented',context:'A real joining problem during play.',objective:'Represented two objects joining a group of three with adult support.',engagement:'Told a story about the five objects.',independence:'Adult helped track the count.',nextStep:'Repeat a small meaningful joining problem.',teacher:'Sample educator',createdAt:new Date().toISOString()});s.plans.push({id:uid(),childIds:[a],lessonId:'C077',date:today(),workCycle:'Morning play / exploration',focus:'Revisit the factual comparison observation.',materials:lesson('C077').materials,notes:'Keep familiar materials available.',status:'ready'});})){render();toast('Fictional sample records added.');}}
let ageFilter='',cycleFilter='',progressBand='observed',progressAreaFilter='';
function bandName(id){const b=BANDS.find(b=>b.id===id);return b?b.title+' · '+b.label:'Pathway not recorded'}
function ageMonths(dob){if(!validDate(dob))return null;const d=parseDay(dob),now=parseDay(today());let m=(now.getFullYear()-d.getFullYear())*12+now.getMonth()-d.getMonth();if(now.getDate()<d.getDate())m--;return m;}
function childBand(id){const c=child(id),m=c?ageMonths(c.dob):null;return m===null?undefined:BANDS.find(b=>m>=b.minMonths&&m<b.maxMonthsExclusive);}
function pathwaysView(){return head('Age pathways','Use a pathway to organize the environment and possible invitations. Real cues, access and care needs guide the next step.')+`<div class="notice">The final pathway includes 5- and 6-year-olds, through 83 months. These ranges organize this original curriculum; they are not milestone deadlines or enrollment/readiness tests.</div><div class="grid">${BANDS.map(b=>`<section class="card"><div class="kicker">${esc(b.label)}</div><h2>${esc(b.title)}</h2><p>${esc(b.organization)}</p><p><strong>Adult rhythm:</strong> ${esc(b.teachingCycle)}</p><p class="small muted">${esc(b.priority)}</p><div class="actions">${btn('pathway-library','Explore 14 invitations',`data-id="${b.id}"`,true)}</div></section>`).join('')}</div>`;}
function yearMapView(){const list=CURRICULUM.yearMap.filter(w=>!cycleFilter||String(w.cycle)===cycleFilter);return head('A flexible 48-week map','Twelve inquiry connections, each with four flexible planning slots. Repeat, pause or replace them based on children’s interests and your calendar.',btn('print','Print this map'))+`<div class="toolbar no-print"><label>Connection<select id="cycleFilter"><option value="">All 12 connections</option>${options([...new Map(CURRICULUM.yearMap.map(w=>[String(w.cycle),w.cycleTitle])).entries()],cycleFilter)}</select></label></div><div class="notice">Infants and toddlers do not need a weekly theme. Keep familiar care, comfort, relationships and safe exploration stable. The questions below mainly support older children’s inquiry; use a connection for a younger child only when a real interest makes it meaningful. Four additional weeks of a 52-week calendar can remain flexible for transitions, closures, repetition and family priorities.</div><div class="grid">${list.map(w=>`<section class="card"><div class="kicker">Planning slot ${w.week} · Connection ${w.cycle}</div><h3>${esc(w.cycleTitle)}</h3><p>${esc(w.question)}</p><p class="small muted">${esc(w.planningFocus)}</p><div class="actions no-print">${btn('week-plan','Draft an invitation',`data-id="${w.week}"`)}</div></section>`).join('')}</div>`;}
function planFromWeek(n){const w=CURRICULUM.yearMap.find(w=>w.week===n);if(!w)return;const b=childBand(selectedChild),candidate=lessons().find(l=>l.ageBand===(b?.id||ageFilter||'B05'));planForm(undefined,candidate?.id,selectedChild||undefined);const f=document.querySelector('#planForm');if(f){const young=(BANDS.find(x=>x.id===candidate?.ageBand)?.maxMonthsExclusive||99)<=36;f.elements.focus.value=(young?w.infantToddlerUse:'Possible inquiry connection: '+w.question)+'\nConfirm actual interest and prior observation before offering.';}}
const originalChildForm=childForm;
childForm=function(id){originalChildForm(id);const c=child(id);document.querySelector('#childForm .form-grid').insertAdjacentHTML('beforeend',textField('Family priority / perspective · optional','familyPriority',c?.familyPriority||'')+textField('Comfortable interaction and transition preferences · optional','routinePreferences',c?.routinePreferences||''));};
const originalLessonForm=lessonForm;
lessonForm=function(id){originalLessonForm(id);const l=state.customLessons.find(l=>l.id===id);const f=document.querySelector('#lessonForm');f.querySelector('.form-grid').insertAdjacentHTML('afterbegin',`<label>Age pathway<select name="ageBand">${options(BANDS.map(b=>[b.id,b.title+' · '+b.label]),l?.ageBand||childBand(selectedChild)?.id||'B05')}</select></label>`);if(!id)f.elements.stage.value='Child-led exploration';document.querySelector('#dialogTitle').textContent=id?'Edit custom activity':'Add a custom activity';};
const originalLessonDetail=lessonDetail;
lessonDetail=function(id){originalLessonDetail(id);const l=lesson(id);if(!l)return;document.querySelector('.lesson-detail').insertAdjacentHTML('afterbegin',`<p class="pill">${esc(bandName(l.ageBand))}</p>`);document.querySelector('.lesson-detail').insertAdjacentHTML('beforeend',`<h3>Access and participation</h3><p>${esc(l.adaptations||'Use home-language communication, adapted access and responsive adult support. Review materials for actual safety and care needs.')}</p><h3>Family connection</h3><p>${esc(l.familyConnection||'Share a factual strength and ask what the family notices. Offer an optional everyday connection without purchases or homework.')}</p>`);};
const originalPlanForm=planForm;
planForm=function(id,lessonId,childId){const target=childId||selectedChild||activeChildren()[0]?.id,b=childBand(target);if(!id&&!lessonId&&b)lessonId=lessons().find(l=>l.ageBand===b.id)?.id;originalPlanForm(id,lessonId,childId);const f=document.querySelector('#planForm');if(f)f.querySelector('.form-grid').insertAdjacentHTML('afterbegin','<div class="notice full">Check the pathway against the actual child’s movement, communication, sensory access and care needs. Older-child tools and small-part activities are not infant adaptations. An invitation is a draft until you confirm readiness and safety.</div>');};
const originalObservationForm=observationForm;
observationForm=function(id,lessonId,childId,planId){const target=childId||selectedChild||activeChildren()[0]?.id,b=childBand(target);if(!id&&!lessonId&&!planId&&b)lessonId=lessons().find(l=>l.ageBand===b.id)?.id;originalObservationForm(id,lessonId,childId,planId);};
const originalChildrenView=childrenView;
childrenView=function(){return originalChildrenView().replaceAll('Edit profile','Edit profile');};
const originalDashboard=dashboard;
dashboard=function(){return originalDashboard()+`<section class="panel"><h2>A whole-child day</h2><p>Protect responsive care, warm relationships, self-chosen play, outdoor movement, meaningful conversation, creative choices and rest/quiet options. Small-group teaching supports these experiences; it does not replace them.</p><p class="small muted">This is an original curriculum draft. Live source retrieval and a national popularity ranking could not be verified; read the teaching guide and research report.</p></section>`;};

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){go(b.dataset.view);return}const a=b.dataset.action,id=b.dataset.id;if(!a)return;switch(a){case'pathway-library':ageFilter=id;areaFilter='';search='';go('curriculum');break;case'week-plan':planFromWeek(Number(id));break;case'close':closeDialog();break;case'child-new':childForm();break;case'child-edit':childForm(id);break;case'child-archive':{const c=child(id);if(confirm(`${c.archived?'Restore':'Archive'} ${c.name}? Plans and observations will be kept.`)&&commit(s=>s.children.find(c=>c.id===id).archived=!c.archived)){render();toast(c.archived?'Child restored.':'Child archived; records retained.');}break}case'child-progress':selectedChild=id;go('progress');break;case'lesson-view':lessonDetail(id);break;case'lesson-new':lessonForm();break;case'lesson-edit':lessonForm(id);break;case'plan-new':planForm();break;case'plan-edit':planForm(id);break;case'plan-from-lesson':planForm(undefined,id);break;case'observe-from-lesson':observationForm(undefined,id);break;case'observe-specific':observationForm(undefined,id,b.dataset.child);break;case'observation-new':observationForm();break;case'observation-edit':observationForm(id);break;case'plan-observe':{const p=state.plans.find(p=>p.id===id);observationForm(undefined,p.lessonId,p.childIds[0],id);break}case'plan-from-observation':{const o=state.observations.find(o=>o.id===id);planForm(undefined,o.lessonId,o.childId);break}case'plan-delete':case'observation-delete':{const key=a==='plan-delete'?'plans':'observations';if(confirm('Delete this record permanently? Export a backup first if you may need it.')&&commit(s=>s[key]=s[key].filter(r=>r.id!==id))){closeDialog();render();toast('Record deleted.');}break}case'previous-week':week=dayAdd(week,-7);render();break;case'next-week':week=dayAdd(week,7);render();break;case'this-week':week=weekStart(today());render();break;case'go-planner':go('planner');break;case'go-guide':go('guide');break;case'print':window.print();break;case'backup':backup();break;case'import':document.querySelector('#importFile').click();break;case'csv':exportCsv();break;case'csv-all':exportCsv(true);break;case'demo':loadDemo();break;}});
document.addEventListener('change',e=>{const t=e.target;switch(t.id){case'progressBand':progressBand=t.value;render();break;case'ageFilter':ageFilter=t.value;render();break;case'cycleFilter':cycleFilter=t.value;render();break;case'archivedToggle':showArchived=t.checked;render();break;case'areaFilter':areaFilter=t.value;render();break;case'progressArea':progressAreaFilter=t.value;render();break;case'stageFilter':stageFilter=t.value;render();break;case'weekDate':if(validDate(t.value))week=weekStart(t.value);render();break;case'plannerChild':case'observationChild':case'progressChild':case'reportChild':selectedChild=t.value;render();break;case'observationStatus':observationFilter=t.value;render();break;case'reportFrom':reportFrom=t.value;render();break;case'reportTo':reportTo=t.value;render();break;}if(t.name==='lessonId'&&t.form?.id==='planForm'){t.form.elements.materials.value=lesson(t.value)?.materials||'';}});
document.addEventListener('input',e=>{if(e.target.id==='lessonSearch'){const pos=e.target.selectionStart;search=e.target.value;render();const input=document.querySelector('#lessonSearch');input.focus();input.setSelectionRange(pos,pos);}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f),get=k=>String(fd.get(k)||'').trim(),id=f.dataset.id||uid();let saved=false;
 if(f.id==='childForm'){const old=child(id);const c={id,name:get('name'),dob:get('dob'),start:get('start'),teacher:get('teacher'),language:get('language'),strengths:get('strengths'),interests:get('interests'),supports:get('supports'),archived:old?.archived||false,familyPriority:get('familyPriority'),routinePreferences:get('routinePreferences')};saved=commit(s=>{if(old)s.children[s.children.findIndex(c=>c.id===id)]=c;else s.children.push(c)});}
 if(f.id==='lessonForm'){const l={id,title:get('title'),area:get('area'),stage:get('stage'),ageBand:get('ageBand'),aim:get('aim'),materials:get('materials'),readiness:get('readiness'),steps:get('steps').split('\n').map(x=>x.trim()).filter(Boolean),interest:get('interest'),control:get('control'),observe:get('observe'),nextStep:get('nextStep'),safety:get('safety'),custom:true};saved=commit(s=>{const i=s.customLessons.findIndex(l=>l.id===id);if(i>=0)s.customLessons[i]=l;else s.customLessons.push(l)});}
 if(f.id==='planForm'){const childIds=fd.getAll('childIds');if(!childIds.length){toast('Choose at least one child for the invitation.');return}const p={id,lessonId:get('lessonId'),childIds,date:get('date'),workCycle:get('workCycle'),focus:get('focus'),materials:get('materials'),notes:get('notes'),status:get('status')};saved=commit(s=>{const i=s.plans.findIndex(p=>p.id===id);if(i>=0)s.plans[i]=p;else s.plans.push(p)});if(saved)week=weekStart(p.date);}
 if(f.id==='observationForm'){const old=state.observations.find(o=>o.id===id);const o={id,childId:get('childId'),lessonId:get('lessonId'),date:get('date'),status:get('status'),context:get('context'),objective:get('objective'),engagement:get('engagement'),independence:get('independence'),nextStep:get('nextStep'),teacher:get('teacher'),createdAt:old?.createdAt||new Date().toISOString()};saved=commit(s=>{const i=s.observations.findIndex(o=>o.id===id);if(i>=0)s.observations[i]=o;else s.observations.push(o)});}
 if(saved){closeDialog();if(f.id==='planForm')activeView='planner';if(f.id==='observationForm')activeView='observations';render();toast(memoryOnly?'Kept in this session. Export a backup before closing.':'Saved on this device.');}});
document.querySelector('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{assert(file.size<=10*1024*1024,'Backup exceeds the 10 MB import limit.');const imported=validate(JSON.parse(await file.text()));const count=imported.children.length;if(!confirm(`Restore ${count} child profile(s), ${imported.plans.length} plan(s) and ${imported.observations.length} observation(s)? This REPLACES the current records. A backup download of current records will be requested first. Check that the download completes before closing the app.`))return;backup('Early_Learning_Before_Restore');if(commit(s=>Object.assign(s,imported))){selectedChild='';closeDialog();render();toast('Backup restored. Current records have been replaced.');}}catch(err){alert('Backup was not imported. Current records are unchanged. '+err.message)}});
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY&&!memoryOnly){try{state=e.newValue?validate(JSON.parse(e.newValue)):blank();closeDialog();render();toast('Records changed in another tab. This view has been refreshed.');}catch(err){storageProblem='Another tab changed records to an unreadable format. Export this tab’s records and reload only after checking your backup.';memoryOnly=true;render();}}});
render();
</script></body></html>
